apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-production-deployer
  namespace: edu-homework-grader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-production-deployer
  namespace: edu-homework-grader
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps", "services", "pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-production-deployer
  namespace: edu-homework-grader
subjects:
  - kind: ServiceAccount
    name: github-production-deployer
    namespace: edu-homework-grader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-production-deployer
