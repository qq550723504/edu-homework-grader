apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-production-deployer
  namespace: edu-homework-grader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-production-deployer
  namespace: edu-homework-grader
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["api", "grader", "web", "languagetool"]
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["student-activation-expiry", "operational-evaluation-retention", "production-alert"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["api"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-production-deployer
  namespace: edu-homework-grader
subjects:
  - kind: ServiceAccount
    name: github-production-deployer
    namespace: edu-homework-grader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-production-deployer
