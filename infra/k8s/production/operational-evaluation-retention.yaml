apiVersion: batch/v1
kind: CronJob
metadata:
  name: operational-evaluation-retention
spec:
  schedule: "15 4 * * *"
  timeZone: Asia/Singapore
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: operational-evaluation-retention
          restartPolicy: Never
          containers:
            - name: expire
              image: ghcr.io/qq550723504/edu-homework-grader-api:sha-not-published
              command: ["python", "-m", "edu_grader_api.cli.expire_operational_evaluations"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: edu-grader-runtime
                      key: DATABASE_URL
