apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: edu-homework-grader
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: edu-homework-grader
resources:
  - namespace.yaml
  - services.yaml
  - datastore.yaml
  - application.yaml
  - ingress.yaml
  - postgres-backup.yaml
  - student-activation-expiry.yaml
  - keycloak-student-provisioner-sync.yaml
  - operational-evaluation.yaml
  - operational-evaluation-retention.yaml
configMapGenerator:
  - name: edu-grader-production-realm
    files:
      - realm.json=realm.json
