name: LanguageTool read-timeout evidence integrator

on:
  push:
    branches:
      - agent/languagetool-read-timeout-evidence-v1

permissions:
  contents: write

concurrency:
  group: languagetool-read-timeout-evidence-v1
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/languagetool-read-timeout-evidence-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Implement LanguageTool read-timeout evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"marker missing in {path}: {old[:140]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")


          module = "apps/api/src/edu_grader_api/services/verification_release_timeout_evidence.py"
          replace_once(
              module,
              'DEFAULT_LANGUAGETOOL_HEALTH_URL = base.DEFAULT_LANGUAGETOOL_HEALTH_URL\n\n'
              'DependencyKind = Literal["normalizer", "grader", "similarity"]\n',
              'DEFAULT_LANGUAGETOOL_HEALTH_URL = base.DEFAULT_LANGUAGETOOL_HEALTH_URL\n'
              'DEFAULT_LANGUAGE_FAULT_PROXY_URL = "http://127.0.0.1:58012"\n\n'
              'DependencyKind = Literal["normalizer", "grader", "language", "similarity"]\n',
          )
          replace_once(
              module,
              '    "grader": "grader_timeout",\n    "similarity": "similarity_timeout",\n',
              '    "grader": "grader_timeout",\n'
              '    "language": "language_timeout",\n'
              '    "similarity": "similarity_timeout",\n',
          )
          replace_once(
              module,
              '    "grader": "grader_read_timeout_recovery",\n'
              '    "similarity": "similarity_read_timeout_recovery",\n',
              '    "grader": "grader_read_timeout_recovery",\n'
              '    "language": "language_read_timeout_recovery",\n'
              '    "similarity": "similarity_read_timeout_recovery",\n',
          )

          control_class = dedent('''


          @dataclass(frozen=True, slots=True)
          class LanguageToolFaultProxyControl:
              """Control plane for the containerized LanguageTool response-stall proxy."""

              base_url: str
              request_timeout_seconds: float = 10.0

              def __post_init__(self) -> None:
                  normalized = self.base_url.rstrip("/")
                  if not normalized or self.request_timeout_seconds <= 0:
                      raise ValueError("LanguageTool fault proxy configuration is invalid")
                  object.__setattr__(self, "base_url", normalized)

              def wait_ready(self, *, timeout_seconds: float) -> None:
                  deadline = time.monotonic() + timeout_seconds
                  while time.monotonic() < deadline:
                      try:
                          response = httpx.get(
                              f"{self.base_url}/__fault/health",
                              timeout=self.request_timeout_seconds,
                          )
                          response.raise_for_status()
                          return
                      except httpx.HTTPError:
                          time.sleep(1)
                  raise RuntimeError("LanguageTool fault proxy did not become ready")

              def set_mode(self, mode: ProxyMode) -> None:
                  if mode not in {"stall", "forward"}:
                      raise ValueError("unsupported LanguageTool fault proxy mode")
                  response = httpx.post(
                      f"{self.base_url}/__fault/mode",
                      json={"mode": mode},
                      timeout=self.request_timeout_seconds,
                  )
                  response.raise_for_status()

              def reset_counts(self) -> None:
                  response = httpx.post(
                      f"{self.base_url}/__fault/reset",
                      timeout=self.request_timeout_seconds,
                  )
                  response.raise_for_status()

              def call_counts(self) -> dict[ProxyMode, int]:
                  response = httpx.get(
                      f"{self.base_url}/__fault/counts",
                      timeout=self.request_timeout_seconds,
                  )
                  response.raise_for_status()
                  payload = response.json()
                  if not isinstance(payload, dict):
                      raise RuntimeError("LanguageTool fault proxy returned invalid counts")
                  stall = payload.get("stall")
                  forward = payload.get("forward")
                  if (
                      isinstance(stall, bool)
                      or not isinstance(stall, int)
                      or stall < 0
                      or isinstance(forward, bool)
                      or not isinstance(forward, int)
                      or forward < 0
                  ):
                      raise RuntimeError("LanguageTool fault proxy returned invalid counts")
                  return {"stall": stall, "forward": forward}
          ''')
          replace_once(
              module,
              "\n\ndef run_release_evidence(\n",
              control_class + "\n\ndef run_release_evidence(\n",
          )
          replace_once(
              module,
              '    languagetool_health_url: str = DEFAULT_LANGUAGETOOL_HEALTH_URL,\n'
              ') -> tuple[dict[str, object], base.ReportPaths]:\n',
              '    languagetool_health_url: str = DEFAULT_LANGUAGETOOL_HEALTH_URL,\n'
              '    language_fault_proxy_url: str = DEFAULT_LANGUAGE_FAULT_PROXY_URL,\n'
              ') -> tuple[dict[str, object], base.ReportPaths]:\n',
          )
          replace_once(
              module,
              '        repetition_report, discovered_environment = _run_repetition(context, repetition)\n',
              '        repetition_report, discovered_environment = _run_repetition(\n'
              '            context,\n'
              '            repetition,\n'
              '            language_fault_proxy_url=language_fault_proxy_url,\n'
              '        )\n',
          )
          replace_once(
              module,
              '            "timeout_fault_version": "verification-dependency-read-timeout-v1",\n',
              '            "timeout_fault_version": "verification-dependency-read-timeout-v2",\n',
          )
          replace_once(
              module,
              '            "fault_injection": "local_response_stall_proxy",\n'
              '            "timeout_dependencies": ["normalizer", "grader", "similarity"],\n',
              '            "fault_injection": (\n'
              '                "local_grader_response_stall_proxy_and_containerized_"\n'
              '                "languagetool_response_stall_proxy"\n'
              '            ),\n'
              '            "timeout_dependencies": [\n'
              '                "normalizer",\n'
              '                "grader",\n'
              '                "language",\n'
              '                "similarity",\n'
              '            ],\n',
          )
          replace_once(
              module,
              'def _run_repetition(\n'
              '    context: base.ComposeContext,\n'
              '    repetition: int,\n'
              ') -> tuple[dict[str, object], dict[str, object]]:\n',
              'def _run_repetition(\n'
              '    context: base.ComposeContext,\n'
              '    repetition: int,\n'
              '    *,\n'
              '    language_fault_proxy_url: str,\n'
              ') -> tuple[dict[str, object], dict[str, object]]:\n',
          )
          replace_once(
              module,
              '        stage = "environment_capture"\n'
              '        environment = base._capture_service_environment(context)\n'
              '        stage = "scenario_execution"\n',
              '        stage = "environment_capture"\n'
              '        environment = base._capture_service_environment(context)\n'
              '        stage = "language_fault_proxy_readiness"\n'
              '        language_proxy = LanguageToolFaultProxyControl(language_fault_proxy_url)\n'
              '        language_proxy.wait_ready(timeout_seconds=90)\n'
              '        language_proxy.set_mode("forward")\n'
              '        language_proxy.reset_counts()\n'
              '        stage = "scenario_execution"\n',
          )
          replace_once(
              module,
              '            _append_scenario(\n'
              '                session,\n'
              '                scenarios,\n'
              '                "language_dependency_recovery",\n'
              '                lambda: base._language_recovery_scenario(session, context),\n'
              '            )\n'
              '            base._wait_for_http(f"{context.grader_url}/health", timeout_seconds=90)\n',
              '            language_proxy.set_mode("forward")\n'
              '            language_proxy.reset_counts()\n'
              '            _append_scenario(\n'
              '                session,\n'
              '                scenarios,\n'
              '                "language_dependency_recovery",\n'
              '                lambda: base._language_recovery_scenario(session, context),\n'
              '            )\n'
              '            _append_scenario(\n'
              '                session,\n'
              '                scenarios,\n'
              '                "language_read_timeout_recovery",\n'
              '                lambda: _language_timeout_recovery_scenario(\n'
              '                    session,\n'
              '                    control=language_proxy,\n'
              '                    grader_url=context.grader_url,\n'
              '                    ordinal=repetition * 100 + 50,\n'
              '                ),\n'
              '            )\n'
              '            base._wait_for_http(f"{context.grader_url}/health", timeout_seconds=90)\n',
          )

          language_scenario = dedent('''


          def _language_timeout_recovery_scenario(
              session: Session,
              *,
              control: LanguageToolFaultProxyControl,
              grader_url: str,
              ordinal: int,
          ) -> dict[str, object]:
              dependency: DependencyKind = "language"
              draft = _create_timeout_draft(session, dependency=dependency, ordinal=ordinal)
              session.commit()
              revision = base._revision(session, draft)
              versions_before = base._question_version_count(session)
              grader = HttpGraderClient(grader_url)

              control.reset_counts()
              control.set_mode("stall")
              outage_run = run_budget_aware_candidate_verification(
                  session,
                  draft=draft,
                  revision=revision,
                  grader_client=grader,
              )
              session.commit()
              outage_counts = control.call_counts()
              outage_snapshot = base._run_snapshot(outage_run)

              control.reset_counts()
              control.set_mode("forward")
              recovery_run = run_budget_aware_candidate_verification(
                  session,
                  draft=draft,
                  revision=revision,
                  grader_client=grader,
              )
              session.commit()
              recovery_counts = control.call_counts()
              versions_after = base._question_version_count(session)

              session.expire_all()
              persisted_outage = session.get(base.GenerationValidationRun, outage_run.id)
              if persisted_outage is None:
                  raise base.ProductRegression("language_timeout_run_missing")
              outage_immutable = base._run_snapshot(persisted_outage) == outage_snapshot
              outage_budget = outage_run.feature_summary_json.get("verification_budget_signal")
              recovery_budget = recovery_run.feature_summary_json.get(
                  "verification_budget_signal"
              )
              outage_findings = base._finding_codes(outage_run)
              recovery_findings = base._finding_codes(recovery_run)
              expected_finding = _EXPECTED_TIMEOUT_FINDING[dependency]
              new_calls_after_timeout = max(outage_counts["stall"] - 1, 0)
              passed = (
                  outage_run.status.value == "blocked"
                  and expected_finding in outage_findings
                  and isinstance(outage_budget, dict)
                  and outage_budget.get("status") == "dependency_timeout"
                  and outage_budget.get("terminal_dependency") == dependency
                  and outage_counts["stall"] == 1
                  and new_calls_after_timeout == 0
                  and recovery_run.status.value == "passed"
                  and expected_finding not in recovery_findings
                  and isinstance(recovery_budget, dict)
                  and recovery_budget.get("status") == "completed"
                  and recovery_counts["forward"] > 0
                  and outage_run.id != recovery_run.id
                  and outage_immutable
                  and versions_after == versions_before
              )
              return {
                  "scenario_id": _SCENARIO_ID[dependency],
                  "dependency": dependency,
                  "fault_mode": "read_timeout",
                  "outage_status": outage_run.status.value,
                  "outage_finding_codes": outage_findings,
                  "outage_call_bucket": _call_bucket(outage_counts["stall"]),
                  "new_calls_after_timeout": new_calls_after_timeout,
                  "recovery_status": recovery_run.status.value,
                  "recovery_finding_codes": recovery_findings,
                  "recovery_call_bucket": _call_bucket(recovery_counts["forward"]),
                  "old_run_immutable": outage_immutable,
                  "fresh_budget_completed": (
                      recovery_budget.get("status") == "completed"
                      if isinstance(recovery_budget, dict)
                      else False
                  ),
                  "question_version_delta": versions_after - versions_before,
                  "passed": passed,
              }
          ''')
          replace_once(
              module,
              "\n\ndef _warm_timeout_dependencies(grader_url: str) -> None:\n",
              language_scenario + "\n\ndef _warm_timeout_dependencies(grader_url: str) -> None:\n",
          )
          replace_once(
              module,
              '    question_type = "M2" if dependency == "normalizer" else "M1"\n',
              '    if dependency == "normalizer":\n'
              '        question_type = "M2"\n'
              '    elif dependency == "language":\n'
              '        question_type = "E3"\n'
              '    else:\n'
              '        question_type = "M1"\n',
          )
          replace_once(
              module,
              '    parser.add_argument(\n'
              '        "--languagetool-health-url",\n'
              '        default=os.environ.get(\n'
              '            "RELEASE_EVIDENCE_LANGUAGETOOL_HEALTH_URL",\n'
              '            DEFAULT_LANGUAGETOOL_HEALTH_URL,\n'
              '        ),\n'
              '    )\n'
              '    return parser\n',
              '    parser.add_argument(\n'
              '        "--languagetool-health-url",\n'
              '        default=os.environ.get(\n'
              '            "RELEASE_EVIDENCE_LANGUAGETOOL_HEALTH_URL",\n'
              '            DEFAULT_LANGUAGETOOL_HEALTH_URL,\n'
              '        ),\n'
              '    )\n'
              '    parser.add_argument(\n'
              '        "--language-fault-proxy-url",\n'
              '        default=os.environ.get(\n'
              '            "RELEASE_EVIDENCE_LANGUAGE_FAULT_PROXY_URL",\n'
              '            DEFAULT_LANGUAGE_FAULT_PROXY_URL,\n'
              '        ),\n'
              '    )\n'
              '    return parser\n',
          )
          replace_once(
              module,
              '        languagetool_health_url=arguments.languagetool_health_url,\n'
              '    )\n',
              '        languagetool_health_url=arguments.languagetool_health_url,\n'
              '        language_fault_proxy_url=arguments.language_fault_proxy_url,\n'
              '    )\n',
          )

          proxy_script = dedent('''
              """Container-local LanguageTool response-stall proxy for release evidence."""

              from __future__ import annotations

              from dataclasses import dataclass, field
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
              import json
              import os
              from threading import Lock
              import time
              from urllib.error import HTTPError, URLError
              from urllib.request import Request, urlopen


              Mode = str


              @dataclass(slots=True)
              class FaultState:
                  mode: Mode = "forward"
                  counts: dict[str, int] = field(
                      default_factory=lambda: {"stall": 0, "forward": 0}
                  )
                  lock: Lock = field(default_factory=Lock)

                  def set_mode(self, mode: Mode) -> None:
                      if mode not in {"stall", "forward"}:
                          raise ValueError("unsupported fault mode")
                      with self.lock:
                          self.mode = mode

                  def reset(self) -> None:
                      with self.lock:
                          self.counts = {"stall": 0, "forward": 0}

                  def record(self) -> Mode:
                      with self.lock:
                          mode = self.mode
                          self.counts[mode] += 1
                          return mode

                  def snapshot(self) -> dict[str, int]:
                      with self.lock:
                          return dict(self.counts)


              class FaultProxyServer(ThreadingHTTPServer):
                  daemon_threads = True
                  block_on_close = False
                  allow_reuse_address = True

                  def __init__(
                      self,
                      server_address: tuple[str, int],
                      *,
                      upstream_base: str,
                      stall_seconds: float,
                      forward_timeout_seconds: float,
                  ) -> None:
                      super().__init__(server_address, FaultProxyHandler)
                      self.upstream_base = upstream_base.rstrip("/")
                      self.stall_seconds = stall_seconds
                      self.forward_timeout_seconds = forward_timeout_seconds
                      self.state = FaultState()


              class FaultProxyHandler(BaseHTTPRequestHandler):
                  protocol_version = "HTTP/1.1"

                  def do_GET(self) -> None:  # noqa: N802
                      if self.path == "/__fault/health":
                          self._json_response(200, {"status": "ok"})
                          return
                      if self.path == "/__fault/counts":
                          self._json_response(200, self.server.state.snapshot())  # type: ignore[attr-defined]
                          return
                      self._empty_response(404)

                  def do_POST(self) -> None:  # noqa: N802
                      if self.path == "/__fault/reset":
                          self.server.state.reset()  # type: ignore[attr-defined]
                          self._json_response(200, self.server.state.snapshot())  # type: ignore[attr-defined]
                          return
                      if self.path == "/__fault/mode":
                          payload = self._json_body()
                          mode = payload.get("mode") if isinstance(payload, dict) else None
                          try:
                              self.server.state.set_mode(mode)  # type: ignore[attr-defined]
                          except ValueError:
                              self._empty_response(400)
                              return
                          self._json_response(200, {"mode": mode})
                          return
                      self._proxy_request()

                  def _proxy_request(self) -> None:
                      content_length = int(self.headers.get("Content-Length", "0"))
                      body = self.rfile.read(content_length)
                      mode = self.server.state.record()  # type: ignore[attr-defined]
                      self.close_connection = True
                      if mode == "stall":
                          time.sleep(self.server.stall_seconds)  # type: ignore[attr-defined]
                          return

                      request = Request(
                          f"{self.server.upstream_base}{self.path}",  # type: ignore[attr-defined]
                          data=body,
                          headers={
                              "Content-Type": self.headers.get(
                                  "Content-Type", "application/x-www-form-urlencoded"
                              )
                          },
                          method="POST",
                      )
                      try:
                          with urlopen(  # noqa: S310
                              request,
                              timeout=self.server.forward_timeout_seconds,  # type: ignore[attr-defined]
                          ) as response:
                              response_body = response.read()
                              self._raw_response(
                                  response.status,
                                  response_body,
                                  response.headers.get("Content-Type"),
                              )
                      except HTTPError as error:
                          self._raw_response(
                              error.code,
                              error.read(),
                              error.headers.get("Content-Type"),
                          )
                      except (OSError, TimeoutError, URLError):
                          self._empty_response(502)

                  def _json_body(self) -> object:
                      length = int(self.headers.get("Content-Length", "0"))
                      try:
                          return json.loads(self.rfile.read(length).decode("utf-8"))
                      except (UnicodeDecodeError, ValueError):
                          return None

                  def _json_response(self, status: int, payload: object) -> None:
                      body = json.dumps(payload, sort_keys=True).encode("utf-8")
                      self._raw_response(status, body, "application/json")

                  def _empty_response(self, status: int) -> None:
                      self._raw_response(status, b"", None)

                  def _raw_response(
                      self,
                      status: int,
                      body: bytes,
                      content_type: str | None,
                  ) -> None:
                      self.send_response(status)
                      if content_type:
                          self.send_header("Content-Type", content_type)
                      self.send_header("Content-Length", str(len(body)))
                      self.send_header("Connection", "close")
                      self.end_headers()
                      if body:
                          try:
                              self.wfile.write(body)
                          except BrokenPipeError:
                              return

                  def log_message(self, _format: str, *args: object) -> None:
                      return


              def create_server(
                  host: str,
                  port: int,
                  *,
                  upstream_base: str,
                  stall_seconds: float,
                  forward_timeout_seconds: float,
              ) -> FaultProxyServer:
                  if stall_seconds <= 0 or forward_timeout_seconds <= 0:
                      raise ValueError("fault proxy timeouts must be positive")
                  return FaultProxyServer(
                      (host, port),
                      upstream_base=upstream_base,
                      stall_seconds=stall_seconds,
                      forward_timeout_seconds=forward_timeout_seconds,
                  )


              def main() -> None:
                  server = create_server(
                      "0.0.0.0",
                      int(os.environ.get("LANGUAGETOOL_FAULT_PROXY_PORT", "8020")),
                      upstream_base=os.environ.get(
                          "LANGUAGETOOL_FAULT_PROXY_UPSTREAM",
                          "http://languagetool:8010",
                      ),
                      stall_seconds=float(
                          os.environ.get("LANGUAGETOOL_FAULT_PROXY_STALL_SECONDS", "6")
                      ),
                      forward_timeout_seconds=float(
                          os.environ.get("LANGUAGETOOL_FAULT_PROXY_FORWARD_TIMEOUT_SECONDS", "15")
                      ),
                  )
                  try:
                      server.serve_forever()
                  finally:
                      server.server_close()


              if __name__ == "__main__":
                  main()
          ''').lstrip()
          Path("infra/release-evidence/languagetool_fault_proxy.py").write_text(
              proxy_script,
              encoding="utf-8",
          )

          proxy_tests = dedent('''
              from __future__ import annotations

              from contextlib import contextmanager
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
              import importlib.util
              import json
              from pathlib import Path
              from threading import Thread
              import time
              from types import ModuleType
              from typing import Iterator

              import httpx
              import pytest


              ROOT = Path(__file__).resolve().parents[3]
              SCRIPT = ROOT / "infra" / "release-evidence" / "languagetool_fault_proxy.py"


              def _load_proxy_module() -> ModuleType:
                  spec = importlib.util.spec_from_file_location(
                      "release_evidence_languagetool_fault_proxy",
                      SCRIPT,
                  )
                  if spec is None or spec.loader is None:
                      raise RuntimeError("fault proxy module could not be loaded")
                  module = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(module)
                  return module


              class _LanguageToolHandler(BaseHTTPRequestHandler):
                  protocol_version = "HTTP/1.1"

                  def do_POST(self) -> None:  # noqa: N802
                      length = int(self.headers.get("Content-Length", "0"))
                      self.rfile.read(length)
                      body = json.dumps({"matches": []}).encode("utf-8")
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.send_header("Connection", "close")
                      self.end_headers()
                      self.wfile.write(body)

                  def log_message(self, _format: str, *args: object) -> None:
                      return


              @contextmanager
              def _upstream() -> Iterator[str]:
                  server = ThreadingHTTPServer(("127.0.0.1", 0), _LanguageToolHandler)
                  server.daemon_threads = True
                  thread = Thread(target=server.serve_forever, daemon=True)
                  thread.start()
                  try:
                      host, port = server.server_address[:2]
                      yield f"http://{host}:{port}"
                  finally:
                      server.shutdown()
                      server.server_close()
                      thread.join(timeout=5)


              @contextmanager
              def _proxy(upstream: str) -> Iterator[str]:
                  module = _load_proxy_module()
                  server = module.create_server(
                      "127.0.0.1",
                      0,
                      upstream_base=upstream,
                      stall_seconds=0.15,
                      forward_timeout_seconds=1.0,
                  )
                  thread = Thread(target=server.serve_forever, daemon=True)
                  thread.start()
                  try:
                      host, port = server.server_address[:2]
                      yield f"http://{host}:{port}"
                  finally:
                      server.shutdown()
                      server.server_close()
                      thread.join(timeout=5)


              def test_proxy_control_forwards_and_stalls_without_payload_evidence() -> None:
                  with _upstream() as upstream, _proxy(upstream) as proxy:
                      assert httpx.get(f"{proxy}/__fault/health").json() == {"status": "ok"}
                      httpx.post(f"{proxy}/__fault/reset").raise_for_status()
                      httpx.post(
                          f"{proxy}/__fault/mode",
                          json={"mode": "forward"},
                      ).raise_for_status()
                      forwarded = httpx.post(
                          f"{proxy}/v2/check",
                          data={"text": "synthetic", "language": "en-US"},
                      )
                      assert forwarded.status_code == 200
                      assert forwarded.json() == {"matches": []}
                      assert httpx.get(f"{proxy}/__fault/counts").json() == {
                          "forward": 1,
                          "stall": 0,
                      }

                      httpx.post(f"{proxy}/__fault/reset").raise_for_status()
                      httpx.post(
                          f"{proxy}/__fault/mode",
                          json={"mode": "stall"},
                      ).raise_for_status()
                      with pytest.raises(httpx.ReadTimeout):
                          httpx.post(
                              f"{proxy}/v2/check",
                              data={"text": "synthetic", "language": "en-US"},
                              timeout=0.05,
                          )
                      time.sleep(0.18)
                      assert httpx.get(f"{proxy}/__fault/counts").json() == {
                          "forward": 0,
                          "stall": 1,
                      }


              def test_proxy_rejects_unknown_mode() -> None:
                  with _upstream() as upstream, _proxy(upstream) as proxy:
                      response = httpx.post(
                          f"{proxy}/__fault/mode",
                          json={"mode": "unknown"},
                      )
                      assert response.status_code == 400
          ''').lstrip()
          Path("apps/api/tests/test_languagetool_fault_proxy.py").write_text(
              proxy_tests,
              encoding="utf-8",
          )

          tests = "apps/api/tests/test_verification_release_timeout_evidence.py"
          test_text = Path(tests).read_text(encoding="utf-8")
          test_text += dedent('''


              def test_language_timeout_catalog_is_explicit() -> None:
                  assert evidence.SCENARIO_CATALOG_VERSION == 3
                  assert evidence._EXPECTED_TIMEOUT_FINDING["language"] == "language_timeout"
                  assert (
                      evidence._SCENARIO_ID["language"]
                      == "language_read_timeout_recovery"
                  )


              def test_language_fault_proxy_control_rejects_invalid_configuration() -> None:
                  with pytest.raises(ValueError, match="invalid"):
                      evidence.LanguageToolFaultProxyControl("", request_timeout_seconds=1)
                  with pytest.raises(ValueError, match="invalid"):
                      evidence.LanguageToolFaultProxyControl(
                          "http://127.0.0.1:58012",
                          request_timeout_seconds=0,
                      )
              ''')
          Path(tests).write_text(test_text, encoding="utf-8")

          compose = "infra/release-evidence/compose.yaml"
          replace_once(
              compose,
              '''  grader:
              image: edu-homework-grader/grader:release-evidence
          ''',
              '''  language-fault-proxy:
              image: python:3.13-alpine
              command: ["python", "/app/languagetool_fault_proxy.py"]
              environment:
                LANGUAGETOOL_FAULT_PROXY_PORT: 8020
                LANGUAGETOOL_FAULT_PROXY_UPSTREAM: http://languagetool:8010
                LANGUAGETOOL_FAULT_PROXY_STALL_SECONDS: 6
                LANGUAGETOOL_FAULT_PROXY_FORWARD_TIMEOUT_SECONDS: 15
              volumes:
                - ./languagetool_fault_proxy.py:/app/languagetool_fault_proxy.py:ro
              ports:
                - "${RELEASE_EVIDENCE_LANGUAGE_FAULT_PROXY_PORT:-58012}:8020"
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/__fault/health')"]
                interval: 2s
                timeout: 3s
                retries: 30
              depends_on:
                languagetool:
                  condition: service_healthy

            grader:
              image: edu-homework-grader/grader:release-evidence
          ''',
          )
          replace_once(
              compose,
              '      LANGUAGETOOL_BASE_URL: http://languagetool:8010/v2\n',
              '      LANGUAGETOOL_BASE_URL: http://language-fault-proxy:8020/v2\n',
          )
          replace_once(
              compose,
              '      PROCESSOR_ALLOWED_HOSTS: grader,languagetool,localhost,127.0.0.1\n',
              '      PROCESSOR_ALLOWED_HOSTS: grader,languagetool,language-fault-proxy,localhost,127.0.0.1\n',
          )
          replace_once(
              compose,
              '''    depends_on:
              languagetool:
                condition: service_healthy
          ''',
              '''    depends_on:
              language-fault-proxy:
                condition: service_healthy
          ''',
          )

          workflow = ".github/workflows/verification-release-evidence.yml"
          replace_once(
              workflow,
              '      - "apps/api/tests/test_verification_release_timeout_evidence.py"\n'
              '      - "infra/release-evidence/**"\n',
              '      - "apps/api/tests/test_verification_release_timeout_evidence.py"\n'
              '      - "apps/api/tests/test_languagetool_fault_proxy.py"\n'
              '      - "infra/release-evidence/**"\n',
          )
          replace_once(
              workflow,
              '      RELEASE_EVIDENCE_LANGUAGETOOL_HEALTH_URL: http://127.0.0.1:58011/v2/languages\n'
              '      RELEASE_EVIDENCE_SOURCE_REVISION:',
              '      RELEASE_EVIDENCE_LANGUAGETOOL_HEALTH_URL: http://127.0.0.1:58011/v2/languages\n'
              '      RELEASE_EVIDENCE_LANGUAGE_FAULT_PROXY_URL: http://127.0.0.1:58012\n'
              '      RELEASE_EVIDENCE_SOURCE_REVISION:',
          )

          docs = "docs/verification-release-evidence.md"
          replace_once(docs, "## Scenario catalog v2\n", "## Scenario catalog v3\n")
          replace_once(
              docs,
              '- the repository LanguageTool image;\n'
              '- the repository Grader image configured to call that LanguageTool service.\n',
              '- the repository LanguageTool image;\n'
              '- a containerized, payload-blind LanguageTool response-stall proxy;\n'
              '- the repository Grader image configured to call LanguageTool through that proxy.\n',
          )
          language_docs = dedent('''

              ### Explicit LanguageTool read timeout

              A containerized fault proxy sits between the real Grader and LanguageTool. In stall mode it accepts exactly one `/v2/check` request and withholds the response longer than `LANGUAGETOOL_TIMEOUT_SECONDS`; in forward mode it relays a fresh recovery request to the real LanguageTool service.

              The scenario succeeds only when:

              - the outage run is `blocked` with `language_timeout`;
              - the shared budget records `dependency_timeout` and terminal dependency `language`;
              - exactly one LanguageTool request reaches stall mode and no additional request starts after terminal timeout;
              - a fresh run forwards through the same proxy and completes with `passed` and a `completed` budget;
              - the prior blocked run remains immutable;
              - no `QuestionVersion` is created.

              The proxy control plane exposes only mode and aggregate call counts. It does not persist request bodies, candidate content, upstream locations or exception text.
          ''')
          replace_once(
              docs,
              "\n## Evidence outputs\n",
              language_docs + "\n## Evidence outputs\n",
          )
          replace_once(
              docs,
              '- controlled connect-timeout injection or an explicit LanguageTool read-timeout proxy scenario;\n',
              '- controlled connect-timeout injection for all four dependency categories;\n',
          )
          PY

