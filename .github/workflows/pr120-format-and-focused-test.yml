name: PR 120 format and focused test

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  format-and-test:
    if: >-
      github.head_ref == 'agent/verification-performance-v1' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/verification-performance-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python packages
        run: make install-python

      - name: Format, lint, and run focused tests
        run: |
          set -euo pipefail
          make ruff-version-check
          python -m ruff format \
            apps/api/src/edu_grader_api/services/verification_performance.py \
            apps/api/tests/test_verification_performance.py
          python -m ruff check --config ruff.toml \
            apps/api/src/edu_grader_api/services/verification_performance.py \
            apps/api/tests/test_verification_performance.py
          python -m pytest apps/api/tests/test_verification_performance.py -q
          make verification-performance WARMUPS=0 ITERATIONS=1 OUTPUT=/tmp/verification-performance
          test -s /tmp/verification-performance/verification-performance-v1.json
          test -s /tmp/verification-performance/verification-performance-v1.md
          git diff --check

      - name: Commit formatted implementation and remove workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr120-format-and-focused-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: validate verification performance reports'
          git push origin HEAD:agent/verification-performance-v1
