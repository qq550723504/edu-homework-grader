name: PR 123 immutable run persistence integrator

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr123-immutable-run-integrator
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'agent/verification-release-evidence-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/verification-release-evidence-v1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply single-insert persistence contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"marker missing in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")


          core_path = "apps/api/src/edu_grader_api/services/question_verification.py"
          replace_once(
              core_path,
              '''@dataclass(frozen=True)
          class VerificationFinding:
              code: str
              severity: ValidationFindingSeverity
              evidence: dict[str, object]
              remediation: str


          @dataclass(frozen=True)
          class _CandidateEvaluation:
          ''',
              '''@dataclass(frozen=True)
          class VerificationFinding:
              code: str
              severity: ValidationFindingSeverity
              evidence: dict[str, object]
              remediation: str


          @dataclass(frozen=True)
          class VerificationPersistencePlan:
              findings: tuple[VerificationFinding, ...]
              validator_version: str
              ruleset_version: str
              feature_summary_extensions: dict[str, object]


          VerificationPersistenceFinalizer = Callable[
              [VerificationPersistencePlan], VerificationPersistencePlan
          ]


          @dataclass(frozen=True)
          class _CandidateEvaluation:
          ''',
          )
          replace_once(
              core_path,
              '''def run_candidate_verification(
              session: Session,
              *,
              draft: GeneratedQuestionDraft,
              revision: GeneratedQuestionDraftRevision,
              grader_client: VerificationGraderClient,
              budget: VerificationBudget | None = None,
          ) -> GenerationValidationRun:
          ''',
              '''def run_candidate_verification(
              session: Session,
              *,
              draft: GeneratedQuestionDraft,
              revision: GeneratedQuestionDraftRevision,
              grader_client: VerificationGraderClient,
              budget: VerificationBudget | None = None,
              persistence_finalizer: VerificationPersistenceFinalizer | None = None,
          ) -> GenerationValidationRun:
          ''',
          )
          replace_once(
              core_path,
              '''        math_semantics_signal=evaluation.math_semantics_signal,
                  budget=budget,
              )
          ''',
              '''        math_semantics_signal=evaluation.math_semantics_signal,
                  budget=budget,
                  persistence_finalizer=persistence_finalizer,
              )
          ''',
          )
          replace_once(
              core_path,
              '''    math_semantics_signal: dict[str, object],
              budget: VerificationBudget | None = None,
          ) -> GenerationValidationRun:
          ''',
              '''    math_semantics_signal: dict[str, object],
              budget: VerificationBudget | None = None,
              persistence_finalizer: VerificationPersistenceFinalizer | None = None,
          ) -> GenerationValidationRun:
          ''',
          )
          replace_once(
              core_path,
              '''    if snapshot_changed_before_lock or current_revision != evaluated_revision:
                  findings = [_duplicate_unavailable_finding()]
              latest_run_number = session.scalar(
          ''',
              '''    if snapshot_changed_before_lock or current_revision != evaluated_revision:
                  findings = [_duplicate_unavailable_finding()]
              plan = VerificationPersistencePlan(
                  findings=tuple(findings),
                  validator_version=VALIDATOR_VERSION,
                  ruleset_version=RULESET_VERSION,
                  feature_summary_extensions={},
              )
              if persistence_finalizer is not None:
                  plan = persistence_finalizer(plan)
              findings = list(plan.findings)
              latest_run_number = session.scalar(
          ''',
          )
          replace_once(
              core_path,
              '''        validator_version=VALIDATOR_VERSION,
                  ruleset_version=RULESET_VERSION,
          ''',
              '''        validator_version=plan.validator_version,
                  ruleset_version=plan.ruleset_version,
          ''',
          )
          replace_once(
              core_path,
              '''            "math_semantics_signal": math_semantics_signal,
                      **duplicate_feature_summary,
                  },
          ''',
              '''            "math_semantics_signal": math_semantics_signal,
                      **duplicate_feature_summary,
                      **plan.feature_summary_extensions,
                  },
          ''',
          )

          capacity_path = Path(
              "apps/api/src/edu_grader_api/services/capacity_aware_verification.py"
          )
          capacity_path.write_text(
              dedent('''
                  """Fail-fast candidate verification wrapper with de-identified capacity evidence."""

                  from __future__ import annotations

                  from sqlalchemy.orm import Session

                  from ..models import (
                      GeneratedQuestionDraft,
                      GeneratedQuestionDraftRevision,
                      GenerationValidationRun,
                      ValidationFindingSeverity,
                  )
                  from . import question_verification as verification
                  from .grade_complexity import unavailable_grade_complexity_signal
                  from .math_semantics import unavailable_math_semantics_signal
                  from .objective_prerequisites import unavailable_objective_prerequisite_signal
                  from .verification_budget import (
                      VerificationBudget,
                      VerificationBudgetExceeded,
                      VerificationDependencyTimeout,
                  )
                  from .verification_capacity import (
                      evaluate_verification_capacity,
                      unavailable_verification_capacity_signal,
                  )

                  CAPACITY_AWARE_VALIDATOR_VERSION = "verification-v9"
                  CAPACITY_AWARE_RULESET_VERSION = "rules-v9"


                  def run_capacity_aware_candidate_verification(
                      session: Session,
                      *,
                      draft: GeneratedQuestionDraft,
                      revision: GeneratedQuestionDraftRevision,
                      grader_client: verification.VerificationGraderClient,
                      budget: VerificationBudget | None = None,
                      persistence_finalizer: verification.VerificationPersistenceFinalizer | None = None,
                  ) -> GenerationValidationRun:
                      """Reject over-capacity candidates before recursive or external work."""

                      if revision.generated_question_draft_id != draft.id:
                          raise ValueError("candidate revision does not belong to the draft")

                      if budget is not None:
                          budget.check("capacity_preflight")

                      try:
                          capacity = evaluate_verification_capacity(revision.candidate_json)
                      except (VerificationBudgetExceeded, VerificationDependencyTimeout):
                          raise
                      except Exception:
                          if budget is not None:
                              budget.check("capacity_preflight")
                          return _persist_capacity_failure(
                              session,
                              draft=draft,
                              revision=revision,
                              findings=[
                                  verification.VerificationFinding(
                                      code="validator_unavailable",
                                      severity=ValidationFindingSeverity.BLOCKED,
                                      evidence={"category": "capacity_preflight_unavailable"},
                                      remediation=(
                                          "Retry validation. If the problem continues, contact an administrator."
                                      ),
                                  )
                              ],
                              signal=unavailable_verification_capacity_signal(
                                  "capacity_preflight_unavailable"
                              ),
                              reason="capacity_preflight_unavailable",
                              budget=budget,
                              persistence_finalizer=persistence_finalizer,
                          )

                      if budget is not None:
                          budget.check("capacity_preflight")

                      capacity_signal = capacity.feature_summary()
                      finalizer = _capacity_persistence_finalizer(
                          capacity_signal,
                          persistence_finalizer,
                      )
                      if not capacity.blocked:
                          return verification.run_candidate_verification(
                              session,
                              draft=draft,
                              revision=revision,
                              grader_client=grader_client,
                              budget=budget,
                              persistence_finalizer=finalizer,
                          )

                      findings = [
                          verification.VerificationFinding(
                              code=finding.code,
                              severity=ValidationFindingSeverity.BLOCKED,
                              evidence=finding.evidence,
                              remediation=finding.remediation,
                          )
                          for finding in capacity.findings
                      ]
                      return _persist_capacity_failure(
                          session,
                          draft=draft,
                          revision=revision,
                          findings=findings,
                          signal=capacity_signal,
                          reason="capacity_preflight_blocked",
                          budget=budget,
                          persistence_finalizer=persistence_finalizer,
                      )


                  def _persist_capacity_failure(
                      session: Session,
                      *,
                      draft: GeneratedQuestionDraft,
                      revision: GeneratedQuestionDraftRevision,
                      findings: list[verification.VerificationFinding],
                      signal: dict[str, object],
                      reason: str,
                      budget: VerificationBudget | None = None,
                      persistence_finalizer: verification.VerificationPersistenceFinalizer | None = None,
                  ) -> GenerationValidationRun:
                      return verification._persist_run(
                          session,
                          draft=draft,
                          evaluated_revision_id=revision.id,
                          evaluated_revision_hash=revision.content_hash,
                          findings=findings,
                          duplicate_feature_summary=_capacity_blocked_duplicate_summary(reason),
                          difficulty_signal=verification._unavailable_difficulty_signal(),
                          grade_complexity_signal=unavailable_grade_complexity_signal(reason),
                          objective_prerequisite_signal=unavailable_objective_prerequisite_signal(reason),
                          math_semantics_signal=unavailable_math_semantics_signal(reason),
                          budget=budget,
                          persistence_finalizer=_capacity_persistence_finalizer(
                              signal,
                              persistence_finalizer,
                          ),
                      )


                  def _capacity_persistence_finalizer(
                      signal: dict[str, object],
                      downstream: verification.VerificationPersistenceFinalizer | None = None,
                  ) -> verification.VerificationPersistenceFinalizer:
                      def finalize(
                          plan: verification.VerificationPersistencePlan,
                      ) -> verification.VerificationPersistencePlan:
                          enriched = verification.VerificationPersistencePlan(
                              findings=plan.findings,
                              validator_version=CAPACITY_AWARE_VALIDATOR_VERSION,
                              ruleset_version=CAPACITY_AWARE_RULESET_VERSION,
                              feature_summary_extensions={
                                  **plan.feature_summary_extensions,
                                  "verification_capacity_signal": signal,
                              },
                          )
                          return downstream(enriched) if downstream is not None else enriched

                      return finalize


                  def _capacity_blocked_duplicate_summary(reason: str) -> dict[str, object]:
                      return {
                          "fingerprint_version": None,
                          "candidate_prompt_fingerprint": None,
                          "similarity_threshold": None,
                          "comparison_counts": {
                              "published_question": 0,
                              "batch_candidate": 0,
                          },
                          "embedding_dependency": None,
                          "duplicate_check_availability": "unavailable",
                          "duplicate_check_reason": reason,
                      }
                  ''').lstrip(),
              encoding="utf-8",
          )

          budget_path = Path(
              "apps/api/src/edu_grader_api/services/budget_aware_verification.py"
          )
          budget_path.write_text(
              dedent('''
                  """Production verification wrapper with a shared monotonic timeout budget."""

                  from __future__ import annotations

                  from collections.abc import Callable
                  from time import monotonic

                  from sqlalchemy.orm import Session

                  from ..models import (
                      GeneratedQuestionDraft,
                      GeneratedQuestionDraftRevision,
                      GenerationValidationRun,
                      ValidationFindingSeverity,
                  )
                  from ..settings import settings
                  from . import question_verification as core
                  from .capacity_aware_verification import (
                      _capacity_blocked_duplicate_summary,
                      run_capacity_aware_candidate_verification,
                  )
                  from .grade_complexity import unavailable_grade_complexity_signal
                  from .math_semantics import unavailable_math_semantics_signal
                  from .objective_prerequisites import unavailable_objective_prerequisite_signal
                  from .verification_budget import (
                      VERIFICATION_BUDGET_RULESET_VERSION,
                      BudgetedGraderClient,
                      BudgetStage,
                      DependencyKind,
                      VerificationBudget,
                      VerificationBudgetExceeded,
                      VerificationDependencyTimeout,
                  )
                  from .verification_capacity import unavailable_verification_capacity_signal

                  BUDGET_AWARE_VALIDATOR_VERSION = "verification-v12"
                  BUDGET_AWARE_RULESET_VERSION = "rules-v12"


                  def run_budget_aware_candidate_verification(
                      session: Session,
                      *,
                      draft: GeneratedQuestionDraft,
                      revision: GeneratedQuestionDraftRevision,
                      grader_client: core.VerificationGraderClient,
                      clock: Callable[[], float] = monotonic,
                  ) -> GenerationValidationRun:
                      """Run production validation under one terminal monotonic budget."""

                      if revision.generated_question_draft_id != draft.id:
                          raise ValueError("candidate revision does not belong to the draft")

                      budget = VerificationBudget(
                          total_seconds=settings.verification_total_timeout_seconds,
                          clock=clock,
                      )
                      budgeted_client = BudgetedGraderClient(grader_client, budget)
                      try:
                          budget.check("capacity_preflight")
                          return run_capacity_aware_candidate_verification(
                              session,
                              draft=draft,
                              revision=revision,
                              grader_client=budgeted_client,
                              budget=budget,
                              persistence_finalizer=_budget_persistence_finalizer(budget),
                          )
                      except VerificationBudgetExceeded as error:
                          return _persist_terminal_failure(
                              session,
                              draft=draft,
                              revision=revision,
                              budget=budget,
                              finding=_total_timeout_finding(error.stage, budget.total_seconds),
                          )
                      except VerificationDependencyTimeout as error:
                          return _persist_terminal_failure(
                              session,
                              draft=draft,
                              revision=revision,
                              budget=budget,
                              finding=_dependency_timeout_finding(error.dependency),
                          )


                  def _persist_terminal_failure(
                      session: Session,
                      *,
                      draft: GeneratedQuestionDraft,
                      revision: GeneratedQuestionDraftRevision,
                      budget: VerificationBudget,
                      finding: core.VerificationFinding,
                  ) -> GenerationValidationRun:
                      capacity_signal = unavailable_verification_capacity_signal(
                          "verification_timeout"
                      )
                      return core._persist_run(
                          session,
                          draft=draft,
                          evaluated_revision_id=revision.id,
                          evaluated_revision_hash=revision.content_hash,
                          findings=[finding],
                          duplicate_feature_summary=_capacity_blocked_duplicate_summary(
                              "verification_timeout"
                          ),
                          difficulty_signal=core._unavailable_difficulty_signal(),
                          grade_complexity_signal=unavailable_grade_complexity_signal(
                              "verification_timeout"
                          ),
                          objective_prerequisite_signal=unavailable_objective_prerequisite_signal(
                              "verification_timeout"
                          ),
                          math_semantics_signal=unavailable_math_semantics_signal(
                              "verification_timeout"
                          ),
                          persistence_finalizer=_budget_persistence_finalizer(
                              budget,
                              capacity_signal=capacity_signal,
                          ),
                      )


                  def _budget_persistence_finalizer(
                      budget: VerificationBudget,
                      *,
                      capacity_signal: dict[str, object] | None = None,
                  ) -> core.VerificationPersistenceFinalizer:
                      def finalize(
                          plan: core.VerificationPersistencePlan,
                      ) -> core.VerificationPersistencePlan:
                          if budget.status == "active":
                              budget.check("persist")
                              budget.mark_completed()

                          findings = list(plan.findings)
                          terminal_finding = _finding_for_terminal_budget(budget)
                          if terminal_finding is not None and not any(
                              finding.code == terminal_finding.code for finding in findings
                          ):
                              findings.append(terminal_finding)

                          extensions = dict(plan.feature_summary_extensions)
                          if capacity_signal is not None:
                              extensions["verification_capacity_signal"] = capacity_signal
                          extensions["verification_budget_signal"] = budget.feature_summary()
                          return core.VerificationPersistencePlan(
                              findings=tuple(findings),
                              validator_version=BUDGET_AWARE_VALIDATOR_VERSION,
                              ruleset_version=BUDGET_AWARE_RULESET_VERSION,
                              feature_summary_extensions=extensions,
                          )

                      return finalize


                  def _finding_for_terminal_budget(
                      budget: VerificationBudget,
                  ) -> core.VerificationFinding | None:
                      signal = budget.feature_summary()
                      if budget.status == "total_timeout":
                          stage = signal.get("terminal_stage")
                          return _total_timeout_finding(
                              stage if isinstance(stage, str) else "persist",
                              budget.total_seconds,
                          )
                      if budget.status == "dependency_timeout":
                          dependency = signal.get("terminal_dependency")
                          if dependency in {"normalizer", "grader", "language", "similarity"}:
                              return _dependency_timeout_finding(dependency)
                      return None


                  def _total_timeout_finding(
                      stage: BudgetStage | str, total_budget_seconds: float
                  ) -> core.VerificationFinding:
                      return core.VerificationFinding(
                          code="verification_total_timeout",
                          severity=ValidationFindingSeverity.BLOCKED,
                          evidence={
                              "ruleset_version": VERIFICATION_BUDGET_RULESET_VERSION,
                              "stage": stage,
                              "total_budget_seconds": total_budget_seconds,
                          },
                          remediation=(
                              "Retry validation after reducing load or restoring validation capacity."
                          ),
                      )


                  def _dependency_timeout_finding(
                      dependency: DependencyKind,
                  ) -> core.VerificationFinding:
                      code = {
                          "normalizer": "normalizer_timeout",
                          "grader": "grader_timeout",
                          "language": "language_timeout",
                          "similarity": "similarity_timeout",
                      }[dependency]
                      return core.VerificationFinding(
                          code=code,
                          severity=ValidationFindingSeverity.BLOCKED,
                          evidence={
                              "ruleset_version": VERIFICATION_BUDGET_RULESET_VERSION,
                              "dependency": dependency,
                          },
                          remediation=(
                              "Retry validation after the required validation dependency is available."
                          ),
                      )
                  ''').lstrip(),
              encoding="utf-8",
          )

          capacity_tests = Path("apps/api/tests/test_capacity_aware_verification.py")
          capacity_tests.write_text(
              dedent('''
                  from __future__ import annotations

                  import inspect
                  from types import SimpleNamespace
                  from uuid import uuid4

                  import pytest

                  from edu_grader_api.services import capacity_aware_verification as capacity_wrapper
                  from edu_grader_api.services import question_verification as verification
                  from edu_grader_api.services.capacity_aware_verification import (
                      run_capacity_aware_candidate_verification,
                  )
                  from edu_grader_api.services.verification_capacity import MAX_PROMPT_CHARS


                  class FakeSession:
                      def __init__(self) -> None:
                          self.flush_count = 0

                      def flush(self) -> None:
                          self.flush_count += 1


                  def revision(candidate_json: dict[str, object]) -> SimpleNamespace:
                      return SimpleNamespace(
                          id=uuid4(),
                          generated_question_draft_id=uuid4(),
                          candidate_json=candidate_json,
                          content_hash="a" * 64,
                      )


                  def draft_for(current_revision: SimpleNamespace) -> SimpleNamespace:
                      return SimpleNamespace(
                          id=current_revision.generated_question_draft_id,
                          job_id=uuid4(),
                          current_revision_id=current_revision.id,
                      )


                  def validation_run(*, finding_count: int) -> SimpleNamespace:
                      return SimpleNamespace(
                          feature_summary_json={"finding_count": finding_count},
                          validator_version="verification-v8",
                          ruleset_version="rules-v8",
                      )


                  def apply_plan(
                      run: SimpleNamespace,
                      finalizer: verification.VerificationPersistenceFinalizer,
                      *,
                      findings: tuple[verification.VerificationFinding, ...] = (),
                  ) -> verification.VerificationPersistencePlan:
                      plan = finalizer(
                          verification.VerificationPersistencePlan(
                              findings=findings,
                              validator_version="verification-v8",
                              ruleset_version="rules-v8",
                              feature_summary_extensions={},
                          )
                      )
                      run.validator_version = plan.validator_version
                      run.ruleset_version = plan.ruleset_version
                      run.feature_summary_json = {
                          **run.feature_summary_json,
                          **plan.feature_summary_extensions,
                      }
                      return plan


                  def test_over_capacity_candidate_never_delegates_to_core_verifier(
                      monkeypatch: pytest.MonkeyPatch,
                  ) -> None:
                      session = FakeSession()
                      current_revision = revision({"prompt": "x" * (MAX_PROMPT_CHARS + 1)})
                      draft = draft_for(current_revision)
                      captured: dict[str, object] = {}
                      run = validation_run(finding_count=1)

                      def fail_if_delegated(*args: object, **kwargs: object) -> object:
                          raise AssertionError(
                              "core verifier must not run for an over-capacity candidate"
                          )

                      def fake_persist(*args: object, **kwargs: object) -> object:
                          captured.update(kwargs)
                          finalizer = kwargs["persistence_finalizer"]
                          assert callable(finalizer)
                          apply_plan(run, finalizer, findings=tuple(kwargs["findings"]))
                          return run

                      monkeypatch.setattr(
                          verification, "run_candidate_verification", fail_if_delegated
                      )
                      monkeypatch.setattr(verification, "_persist_run", fake_persist)

                      result = run_capacity_aware_candidate_verification(
                          session,  # type: ignore[arg-type]
                          draft=draft,  # type: ignore[arg-type]
                          revision=current_revision,  # type: ignore[arg-type]
                          grader_client=SimpleNamespace(),  # type: ignore[arg-type]
                      )

                      assert result is run
                      findings = captured["findings"]
                      assert isinstance(findings, list)
                      assert [finding.code for finding in findings] == [
                          "candidate_capacity_limit_exceeded"
                      ]
                      signal = run.feature_summary_json["verification_capacity_signal"]
                      assert signal["violations"] == ["prompt_chars"]
                      assert run.validator_version == "verification-v9"
                      assert run.ruleset_version == "rules-v9"
                      assert session.flush_count == 0


                  def test_valid_candidate_delegates_with_preinsert_capacity_plan(
                      monkeypatch: pytest.MonkeyPatch,
                  ) -> None:
                      session = FakeSession()
                      current_revision = revision(
                          {
                              "prompt": "What is 2 + 2?",
                              "explanation": "Add the values.",
                              "rule_json": {"expected": 4},
                          }
                      )
                      draft = draft_for(current_revision)
                      run = validation_run(finding_count=0)
                      calls: list[dict[str, object]] = []

                      def fake_delegate(*args: object, **kwargs: object) -> object:
                          calls.append(kwargs)
                          finalizer = kwargs["persistence_finalizer"]
                          assert callable(finalizer)
                          apply_plan(run, finalizer)
                          return run

                      monkeypatch.setattr(
                          verification, "run_candidate_verification", fake_delegate
                      )

                      result = run_capacity_aware_candidate_verification(
                          session,  # type: ignore[arg-type]
                          draft=draft,  # type: ignore[arg-type]
                          revision=current_revision,  # type: ignore[arg-type]
                          grader_client=SimpleNamespace(),  # type: ignore[arg-type]
                      )

                      assert result is run
                      assert len(calls) == 1
                      signal = run.feature_summary_json["verification_capacity_signal"]
                      assert signal["availability"] == "available"
                      assert signal["load_bucket"] == "small"
                      assert run.validator_version == "verification-v9"
                      assert run.ruleset_version == "rules-v9"
                      assert session.flush_count == 0


                  def test_capacity_evaluator_failure_is_persisted_fail_closed(
                      monkeypatch: pytest.MonkeyPatch,
                  ) -> None:
                      session = FakeSession()
                      current_revision = revision({"prompt": "private candidate content"})
                      draft = draft_for(current_revision)
                      captured: dict[str, object] = {}
                      run = validation_run(finding_count=1)

                      def explode(candidate: object) -> object:
                          raise RuntimeError("private candidate diagnostic")

                      def fake_persist(*args: object, **kwargs: object) -> object:
                          captured.update(kwargs)
                          finalizer = kwargs["persistence_finalizer"]
                          assert callable(finalizer)
                          apply_plan(run, finalizer, findings=tuple(kwargs["findings"]))
                          return run

                      monkeypatch.setattr(
                          capacity_wrapper, "evaluate_verification_capacity", explode
                      )
                      monkeypatch.setattr(verification, "_persist_run", fake_persist)

                      result = run_capacity_aware_candidate_verification(
                          session,  # type: ignore[arg-type]
                          draft=draft,  # type: ignore[arg-type]
                          revision=current_revision,  # type: ignore[arg-type]
                          grader_client=SimpleNamespace(),  # type: ignore[arg-type]
                      )

                      assert result is run
                      findings = captured["findings"]
                      assert isinstance(findings, list)
                      assert [finding.code for finding in findings] == ["validator_unavailable"]
                      signal = run.feature_summary_json["verification_capacity_signal"]
                      assert signal["availability"] == "unavailable"
                      assert "private candidate" not in str(run.feature_summary_json)
                      assert run.validator_version == "verification-v9"


                  def test_revision_must_belong_to_draft_before_preflight(
                      monkeypatch: pytest.MonkeyPatch,
                  ) -> None:
                      current_revision = revision({"prompt": "What is 2 + 2?"})
                      draft = SimpleNamespace(
                          id=uuid4(),
                          job_id=uuid4(),
                          current_revision_id=current_revision.id,
                      )
                      monkeypatch.setattr(
                          capacity_wrapper,
                          "evaluate_verification_capacity",
                          lambda value: (_ for _ in ()).throw(
                              AssertionError(
                                  "capacity evaluator must not run for the wrong draft"
                              )
                          ),
                      )

                      with pytest.raises(ValueError, match="candidate revision does not belong"):
                          run_capacity_aware_candidate_verification(
                              FakeSession(),  # type: ignore[arg-type]
                              draft=draft,  # type: ignore[arg-type]
                              revision=current_revision,  # type: ignore[arg-type]
                              grader_client=SimpleNamespace(),  # type: ignore[arg-type]
                          )


                  def test_review_service_has_no_direct_core_or_capacity_verification_bypass() -> None:
                      from edu_grader_api.services import ai_question_review

                      source = inspect.getsource(ai_question_review)
                      assert "run_candidate_verification(" not in source
                      assert "run_capacity_aware_candidate_verification(" not in source
                      assert source.count("run_budget_aware_candidate_verification(") == 2
                  ''').lstrip(),
              encoding="utf-8",
          )

          budget_tests = Path("apps/api/tests/test_budget_aware_verification.py")
          budget_tests.write_text(
              dedent('''
                  from __future__ import annotations

                  from dataclasses import dataclass
                  from types import SimpleNamespace
                  from uuid import uuid4

                  import pytest

                  from edu_grader_api.models import ValidationFindingSeverity, ValidationRunStatus
                  from edu_grader_api.services import budget_aware_verification as budgeted
                  from edu_grader_api.services.grader import GraderRequestTimeoutError
                  from edu_grader_api.services.questions import GradeResult
                  from edu_grader_api.services.verification_budget import (
                      VERIFICATION_BUDGET_RULESET_VERSION,
                      VerificationBudgetExceeded,
                      VerificationDependencyTimeout,
                  )


                  @dataclass
                  class FakeClock:
                      current: float = 10.0

                      def __call__(self) -> float:
                          return self.current

                      def advance(self, seconds: float) -> None:
                          self.current += seconds


                  class FakeSession:
                      def __init__(self) -> None:
                          self.flush_count = 0

                      def flush(self) -> None:
                          self.flush_count += 1


                  class PassingGrader:
                      def grade(
                          self,
                          question_type: str,
                          rule_json: dict[str, object],
                          answer_json: dict[str, object],
                          *,
                          policy_version: str | None = None,
                      ) -> GradeResult:
                          return GradeResult("auto_accepted", 1, {}, "test-v1")

                      def normalize_math_answer(
                          self, answer_json: dict[str, object]
                      ) -> dict[str, object]:
                          return {"type": "number", "value": "4"}

                      def semantic_similarity(
                          self, query: str, comparisons: list[str]
                      ) -> object:
                          return SimpleNamespace(scores=[0.1 for _ in comparisons])


                  class TimeoutGrader(PassingGrader):
                      def grade(
                          self,
                          question_type: str,
                          rule_json: dict[str, object],
                          answer_json: dict[str, object],
                          *,
                          policy_version: str | None = None,
                      ) -> GradeResult:
                          raise GraderRequestTimeoutError("grade")


                  def draft_and_revision() -> tuple[SimpleNamespace, SimpleNamespace]:
                      draft_id = uuid4()
                      return (
                          SimpleNamespace(id=draft_id, job_id=uuid4()),
                          SimpleNamespace(
                              id=uuid4(),
                              generated_question_draft_id=draft_id,
                              content_hash="a" * 64,
                              candidate_json={"prompt": "safe"},
                          ),
                      )


                  def validation_run() -> SimpleNamespace:
                      return SimpleNamespace(
                          validator_version="verification-v9",
                          ruleset_version="rules-v9",
                          status=ValidationRunStatus.PASSED,
                          feature_summary_json={"finding_count": 0},
                          findings=[],
                      )


                  def apply_plan(
                      run: SimpleNamespace,
                      finalizer: budgeted.core.VerificationPersistenceFinalizer,
                      *,
                      findings: tuple[object, ...] = (),
                  ) -> budgeted.core.VerificationPersistencePlan:
                      plan = finalizer(
                          budgeted.core.VerificationPersistencePlan(
                              findings=findings,  # type: ignore[arg-type]
                              validator_version="verification-v9",
                              ruleset_version="rules-v9",
                              feature_summary_extensions={},
                          )
                      )
                      run.validator_version = plan.validator_version
                      run.ruleset_version = plan.ruleset_version
                      run.findings = list(plan.findings)
                      run.feature_summary_json = {
                          "finding_count": len(plan.findings),
                          **plan.feature_summary_extensions,
                      }
                      if any(
                          getattr(finding, "severity", None)
                          is ValidationFindingSeverity.BLOCKED
                          for finding in plan.findings
                      ):
                          run.status = ValidationRunStatus.BLOCKED
                      return plan


                  def test_completed_run_gets_v12_budget_signal_before_insert(
                      monkeypatch: pytest.MonkeyPatch,
                  ) -> None:
                      session = FakeSession()
                      draft, revision = draft_and_revision()
                      run = validation_run()

                      def fake_capacity(*args: object, **kwargs: object) -> object:
                          finalizer = kwargs["persistence_finalizer"]
                          assert callable(finalizer)
                          apply_plan(run, finalizer)
                          return run

                      monkeypatch.setattr(
                          budgeted, "run_capacity_aware_candidate_verification", fake_capacity
                      )
                      monkeypatch.setattr(
                          budgeted.settings, "verification_total_timeout_seconds", 30.0
                      )

                      result = budgeted.run_budget_aware_candidate_verification(
                          session,  # type: ignore[arg-type]
                          draft=draft,  # type: ignore[arg-type]
                          revision=revision,  # type: ignore[arg-type]
                          grader_client=PassingGrader(),  # type: ignore[arg-type]
                          clock=FakeClock(),
                      )

                      assert result is run
                      assert run.validator_version == "verification-v12"
                      assert run.ruleset_version == "rules-v12"
                      assert run.feature_summary_json["verification_budget_signal"][
                          "status"
                      ] == "completed"
                      assert session.flush_count == 0


                  def test_total_timeout_is_persisted_in_one_final_plan(
                      monkeypatch: pytest.MonkeyPatch,
                  ) -> None:
                      session = FakeSession()
                      draft, revision = draft_and_revision()
                      clock = FakeClock()
                      persisted = validation_run()
                      captured: dict[str, object] = {}

                      def fake_capacity(*args: object, **kwargs: object) -> object:
                          grader_client = kwargs["grader_client"]
                          clock.advance(5)
                          grader_client.grade("M1", {"expected": 4}, {"text": "4"})
                          raise AssertionError("deadline must block the dependency")

                      def fake_persist(*args: object, **kwargs: object) -> object:
                          captured.update(kwargs)
                          finalizer = kwargs["persistence_finalizer"]
                          assert callable(finalizer)
                          apply_plan(
                              persisted,
                              finalizer,
                              findings=tuple(kwargs["findings"]),
                          )
                          return persisted

                      monkeypatch.setattr(
                          budgeted, "run_capacity_aware_candidate_verification", fake_capacity
                      )
                      monkeypatch.setattr(budgeted.core, "_persist_run", fake_persist)
                      monkeypatch.setattr(
                          budgeted.settings, "verification_total_timeout_seconds", 5.0
                      )

                      result = budgeted.run_budget_aware_candidate_verification(
                          session,  # type: ignore[arg-type]
                          draft=draft,  # type: ignore[arg-type]
                          revision=revision,  # type: ignore[arg-type]
                          grader_client=PassingGrader(),  # type: ignore[arg-type]
                          clock=clock,
                      )

                      assert result is persisted
                      assert [finding.code for finding in persisted.findings] == [
                          "verification_total_timeout"
                      ]
                      assert persisted.status is ValidationRunStatus.BLOCKED
                      assert persisted.validator_version == "verification-v12"
                      signal = persisted.feature_summary_json["verification_budget_signal"]
                      assert signal["status"] == "total_timeout"
                      assert signal["terminal_stage"] == "grader"


                  def test_swallowed_dependency_timeout_is_in_final_plan(
                      monkeypatch: pytest.MonkeyPatch,
                  ) -> None:
                      session = FakeSession()
                      draft, revision = draft_and_revision()
                      run = validation_run()
                      generic = budgeted.core.VerificationFinding(
                          code="m1_grader_probe_failed",
                          severity=ValidationFindingSeverity.BLOCKED,
                          evidence={"probe": "grader"},
                          remediation="Retry validation.",
                      )

                      def fake_capacity(*args: object, **kwargs: object) -> object:
                          grader_client = kwargs["grader_client"]
                          with pytest.raises(VerificationDependencyTimeout):
                              grader_client.grade(
                                  "M1", {"expected": 4}, {"text": "private"}
                              )
                          finalizer = kwargs["persistence_finalizer"]
                          assert callable(finalizer)
                          apply_plan(run, finalizer, findings=(generic,))
                          return run

                      monkeypatch.setattr(
                          budgeted, "run_capacity_aware_candidate_verification", fake_capacity
                      )
                      monkeypatch.setattr(
                          budgeted.settings, "verification_total_timeout_seconds", 30.0
                      )

                      result = budgeted.run_budget_aware_candidate_verification(
                          session,  # type: ignore[arg-type]
                          draft=draft,  # type: ignore[arg-type]
                          revision=revision,  # type: ignore[arg-type]
                          grader_client=TimeoutGrader(),  # type: ignore[arg-type]
                          clock=FakeClock(),
                      )

                      assert result is run
                      assert [finding.code for finding in run.findings] == [
                          "m1_grader_probe_failed",
                          "grader_timeout",
                      ]
                      signal = run.feature_summary_json["verification_budget_signal"]
                      assert signal["status"] == "dependency_timeout"
                      assert signal["terminal_dependency"] == "grader"


                  def test_wrong_revision_is_rejected_before_budget_work() -> None:
                      session = FakeSession()
                      draft, revision = draft_and_revision()
                      revision.generated_question_draft_id = uuid4()

                      with pytest.raises(ValueError, match="does not belong"):
                          budgeted.run_budget_aware_candidate_verification(
                              session,  # type: ignore[arg-type]
                              draft=draft,  # type: ignore[arg-type]
                              revision=revision,  # type: ignore[arg-type]
                              grader_client=PassingGrader(),  # type: ignore[arg-type]
                              clock=FakeClock(),
                          )

                      assert session.flush_count == 0


                  def test_terminal_budget_prevents_later_dependency_calls() -> None:
                      clock = FakeClock()
                      budget = budgeted.VerificationBudget(total_seconds=1, clock=clock)
                      client = budgeted.BudgetedGraderClient(PassingGrader(), budget)
                      clock.advance(1)

                      with pytest.raises(VerificationBudgetExceeded):
                          client.grade("M1", {"expected": 4}, {"text": "4"})
                      with pytest.raises(VerificationBudgetExceeded):
                          client.normalize_math_answer({"mathjson": 4})
                  ''').lstrip(),
              encoding="utf-8",
          )
          PY

