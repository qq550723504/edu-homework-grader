name: PR 123 immutable run persistence finalizer

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr123-immutable-run-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'agent/verification-release-evidence-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/verification-release-evidence-v1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Reapply single-insert persistence patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path(
              ".github/workflows/pr123-immutable-run-integrator.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = (
              "          PY\n\n"
              "      - name: Install, format, lint, and run focused regression"
          )
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          Path("/tmp/pr123-persistence-patch.py").write_text(
              script + "\n",
              encoding="utf-8",
          )
          subprocess.run(["python", "/tmp/pr123-persistence-patch.py"], check=True)

          core_path = Path(
              "apps/api/src/edu_grader_api/services/question_verification.py"
          )
          core = core_path.read_text(encoding="utf-8")
          bad_plan = '''    plan = VerificationPersistencePlan(
              findings=tuple(findings),
              validator_version=plan.validator_version,
              ruleset_version=plan.ruleset_version,
              feature_summary_extensions={},
          )
          '''
          good_plan = '''    plan = VerificationPersistencePlan(
              findings=tuple(findings),
              validator_version=VALIDATOR_VERSION,
              ruleset_version=RULESET_VERSION,
              feature_summary_extensions={},
          )
          '''
          if bad_plan not in core:
              raise SystemExit("bad persistence plan marker missing")
          core = core.replace(bad_plan, good_plan, 1)
          old_constructor = '''        run_number=(latest_run_number or 0) + 1,
              validator_version=VALIDATOR_VERSION,
              ruleset_version=RULESET_VERSION,
              status=status,
          '''
          new_constructor = '''        run_number=(latest_run_number or 0) + 1,
              validator_version=plan.validator_version,
              ruleset_version=plan.ruleset_version,
              status=status,
          '''
          if old_constructor not in core:
              raise SystemExit("validation run constructor marker missing")
          core_path.write_text(
              core.replace(old_constructor, new_constructor, 1),
              encoding="utf-8",
          )
          PY

      - name: Format, fix lint, and run focused regression
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            make install-python >/dev/null
            python -m ruff format \
              apps/api/src/edu_grader_api/services/question_verification.py \
              apps/api/src/edu_grader_api/services/capacity_aware_verification.py \
              apps/api/src/edu_grader_api/services/budget_aware_verification.py \
              apps/api/tests/test_capacity_aware_verification.py \
              apps/api/tests/test_budget_aware_verification.py
            python -m ruff check --fix --config ruff.toml \
              apps/api/src/edu_grader_api/services/question_verification.py \
              apps/api/src/edu_grader_api/services/capacity_aware_verification.py \
              apps/api/src/edu_grader_api/services/budget_aware_verification.py \
              apps/api/tests/test_capacity_aware_verification.py \
              apps/api/tests/test_budget_aware_verification.py
            python -m ruff check --config ruff.toml \
              apps/api/src/edu_grader_api/services/question_verification.py \
              apps/api/src/edu_grader_api/services/capacity_aware_verification.py \
              apps/api/src/edu_grader_api/services/budget_aware_verification.py \
              apps/api/tests/test_capacity_aware_verification.py \
              apps/api/tests/test_budget_aware_verification.py
            python -m pytest \
              apps/api/tests/test_capacity_aware_verification.py \
              apps/api/tests/test_budget_aware_verification.py \
              apps/api/tests/test_verification_budget_stage_boundaries.py \
              apps/api/tests/test_question_verification.py \
              apps/api/tests/test_verification_release_evidence.py -q
            git diff --check
          } 2>&1 | tee /tmp/pr123-persistence-regression.log

      - name: Publish failure diagnostic
        if: steps.regression.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### PR #123 immutable persistence regression'
            echo
            echo '```text'
            tail -n 180 /tmp/pr123-persistence-regression.log 2>/dev/null || echo 'regression log unavailable'
            echo '```'
          } > /tmp/comment.md
          gh pr comment 123 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Remove temporary workflows and push implementation
        if: steps.regression.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f \
            .github/workflows/pr123-immutable-run-integrator.yml \
            .github/workflows/pr123-immutable-run-finalizer.yml \
            .github/workflows/pr123-runtime-diagnostics.yml
          git add -A
          git commit -m 'fix: persist final verification contracts in one insert'
          git push origin HEAD:agent/verification-release-evidence-v1

      - name: Fail finalizer when regression fails
        if: steps.regression.outcome != 'success'
        run: exit 1
