name: LanguageTool read-timeout PR bootstrap

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: languagetool-read-timeout-pr-bootstrap
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'agent/languagetool-read-timeout-evidence-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/languagetool-read-timeout-evidence-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply embedded implementation
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path(
              ".github/workflows/languagetool-read-timeout-integrator.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Format, lint, and run focused regression"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          script = script.replace(
              "'''    depends_on:\n    languagetool:\n      condition: service_healthy\n'''",
              "'''    depends_on:\n      languagetool:\n        condition: service_healthy\n'''",
          )
          script = script.replace(
              "'''    depends_on:\n    language-fault-proxy:\n      condition: service_healthy\n'''",
              "'''    depends_on:\n      language-fault-proxy:\n        condition: service_healthy\n'''",
          )
          patch = Path("/tmp/languagetool-read-timeout-patch.py")
          patch.write_text(script + "\n", encoding="utf-8")
          subprocess.run(["python", str(patch)], check=True)

          module_path = Path(
              "apps/api/src/edu_grader_api/services/verification_release_timeout_evidence.py"
          )
          module_text = module_path.read_text(encoding="utf-8")
          old_version = "SCENARIO_CATALOG_VERSION = 2"
          new_version = "SCENARIO_CATALOG_VERSION = 3"
          if old_version not in module_text and new_version not in module_text:
              raise SystemExit("scenario catalog version marker missing")
          module_path.write_text(
              module_text.replace(old_version, new_version, 1),
              encoding="utf-8",
          )

          test_path = Path("apps/api/tests/test_languagetool_fault_proxy.py")
          test_text = test_path.read_text(encoding="utf-8")
          import_marker = "import json\nfrom pathlib import Path\n"
          import_replacement = "import json\nfrom pathlib import Path\nimport sys\n"
          if import_marker not in test_text and import_replacement not in test_text:
              raise SystemExit("proxy test import marker missing")
          test_text = test_text.replace(import_marker, import_replacement, 1)
          load_marker = (
              "    module = importlib.util.module_from_spec(spec)\n"
              "    spec.loader.exec_module(module)\n"
          )
          load_replacement = (
              "    module = importlib.util.module_from_spec(spec)\n"
              "    sys.modules[spec.name] = module\n"
              "    spec.loader.exec_module(module)\n"
          )
          if load_marker not in test_text and load_replacement not in test_text:
              raise SystemExit("proxy module registration marker missing")
          test_path.write_text(
              test_text.replace(load_marker, load_replacement, 1),
              encoding="utf-8",
          )

          compose_path = Path("infra/release-evidence/compose.yaml")
          compose_text = compose_path.read_text(encoding="utf-8")
          self_cycle = (
              "    depends_on:\n"
              "      language-fault-proxy:\n"
              "        condition: service_healthy\n\n"
              "  grader:\n"
          )
          proxy_dependency = (
              "    depends_on:\n"
              "      languagetool:\n"
              "        condition: service_healthy\n\n"
              "  grader:\n"
          )
          if self_cycle in compose_text:
              compose_text = compose_text.replace(
                  self_cycle,
                  proxy_dependency,
                  1,
              )
          grader_start = compose_text.index("\n  grader:\n")
          grader_prefix = compose_text[:grader_start]
          grader_section = compose_text[grader_start:]
          grader_old_dependency = (
              "    depends_on:\n"
              "      languagetool:\n"
              "        condition: service_healthy\n"
          )
          grader_new_dependency = (
              "    depends_on:\n"
              "      language-fault-proxy:\n"
              "        condition: service_healthy\n"
          )
          if (
              grader_old_dependency not in grader_section
              and grader_new_dependency not in grader_section
          ):
              raise SystemExit("grader dependency marker missing")
          compose_path.write_text(
              grader_prefix
              + grader_section.replace(
                  grader_old_dependency,
                  grader_new_dependency,
                  1,
              ),
              encoding="utf-8",
          )
          PY
          } 2>&1 | tee /tmp/languagetool-bootstrap.log

      - name: Publish patch diagnostic
        if: steps.patch.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### LanguageTool read-timeout bootstrap diagnostic'
            echo
            echo '```text'
            tail -n 180 /tmp/languagetool-bootstrap.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment 126 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Format, lint, and run focused regression
        id: regression
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            make install-python >/dev/null
            python -m ruff format \
              apps/api/src/edu_grader_api/services/verification_release_timeout_evidence.py \
              apps/api/tests/test_verification_release_timeout_evidence.py \
              apps/api/tests/test_languagetool_fault_proxy.py \
              infra/release-evidence/languagetool_fault_proxy.py
            python -m ruff check --fix --config ruff.toml \
              apps/api/src/edu_grader_api/services/verification_release_timeout_evidence.py \
              apps/api/tests/test_verification_release_timeout_evidence.py \
              apps/api/tests/test_languagetool_fault_proxy.py \
              infra/release-evidence/languagetool_fault_proxy.py
            python -m ruff check --config ruff.toml \
              apps/api/src/edu_grader_api/services/verification_release_timeout_evidence.py \
              apps/api/tests/test_verification_release_timeout_evidence.py \
              apps/api/tests/test_languagetool_fault_proxy.py \
              infra/release-evidence/languagetool_fault_proxy.py
            python -m pytest \
              apps/api/tests/test_verification_release_timeout_evidence.py \
              apps/api/tests/test_languagetool_fault_proxy.py \
              apps/api/tests/test_verification_release_evidence.py \
              apps/api/tests/test_budget_aware_verification.py \
              apps/api/tests/test_verification_budget.py -q
            docker compose --file infra/release-evidence/compose.yaml config --quiet
            git diff --check
          } 2>&1 | tee /tmp/languagetool-regression.log

      - name: Publish regression diagnostic
        if: steps.patch.outcome == 'success' && steps.regression.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### LanguageTool read-timeout regression diagnostic'
            echo
            echo '```text'
            tail -n 220 /tmp/languagetool-regression.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment 126 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Remove temporary workflows and push implementation
        id: publish
        if: steps.patch.outcome == 'success' && steps.regression.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            rm -f \
              .github/workflows/languagetool-read-timeout-integrator.yml \
              .github/workflows/languagetool-read-timeout-pr-bootstrap.yml \
              .github/.languagetool-read-timeout-trigger
            git add -A
            git status --short
            git commit -m 'feat: add LanguageTool read-timeout evidence'
            git fetch origin agent/languagetool-read-timeout-evidence-v1
            git rebase origin/agent/languagetool-read-timeout-evidence-v1
            git push origin HEAD:agent/languagetool-read-timeout-evidence-v1
          } 2>&1 | tee /tmp/languagetool-publish.log

      - name: Publish branch-write diagnostic
        if: steps.publish.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### LanguageTool read-timeout branch-write diagnostic'
            echo
            echo '```text'
            tail -n 180 /tmp/languagetool-publish.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment 126 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Fail when integration failed
        if: >-
          steps.patch.outcome != 'success' ||
          steps.regression.outcome != 'success' ||
          steps.publish.outcome == 'failure'
        run: exit 1
