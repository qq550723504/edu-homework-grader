name: Verification release evidence

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable 40-character candidate commit SHA; defaults to the selected ref.
        required: false
        type: string
      image_digests:
        description: Optional JSON map of api, grader, web and languagetool SHA-256 image digests.
        required: false
        type: string
  workflow_call:
    inputs:
      source_sha:
        description: Immutable 40-character candidate commit SHA.
        required: true
        type: string
      image_digests:
        description: JSON map of api, grader, web and languagetool SHA-256 image digests.
        required: true
        type: string
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/verification-release-evidence.yml"
      - "Makefile"
      - "apps/api/src/edu_grader_api/services/verification_release_evidence.py"
      - "apps/api/src/edu_grader_api/services/verification_release_timeout_evidence.py"
      - "apps/api/tests/test_verification_release_evidence.py"
      - "apps/api/tests/test_verification_release_timeout_evidence.py"
      - "apps/api/tests/test_budget_aware_verification.py"
      - "apps/api/tests/test_languagetool_fault_proxy.py"
      - "infra/release-evidence/**"
      - "infra/languagetool/**"
      - "services/grader/**"
      - "docs/verification-release-evidence.md"

permissions:
  contents: read
  packages: read

concurrency:
  group: verification-release-evidence-${{ github.event.pull_request.number || inputs.source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  release-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROCESSOR_ALLOWED_HOSTS: grader,languagetool,localhost,127.0.0.1,172.30.254.250,172.30.254.249,172.30.254.248,172.30.254.247
      GRADER_REQUEST_TIMEOUT_SECONDS: "15"
      VERIFICATION_TOTAL_TIMEOUT_SECONDS: "30"
      RELEASE_EVIDENCE_DATABASE_URL: postgresql+psycopg://release_evidence:release-evidence-password@127.0.0.1:55432/release_evidence
      RELEASE_EVIDENCE_GRADER_URL: http://127.0.0.1:58010
      RELEASE_EVIDENCE_LANGUAGETOOL_HEALTH_URL: http://127.0.0.1:58011/v2/languages
      RELEASE_EVIDENCE_LANGUAGE_FAULT_PROXY_URL: http://127.0.0.1:58012
      RELEASE_EVIDENCE_CONNECT_TIMEOUT_NETWORK: 172.30.254.0/24
      RELEASE_EVIDENCE_SOURCE_REVISION: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
      RELEASE_EVIDENCE_IMAGE_DIGESTS: ${{ inputs.image_digests }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python packages
        run: make install-python

      - name: Validate isolated Compose definition
        run: docker compose --file infra/release-evidence/compose.yaml config --quiet

      - name: Write sanitized release manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source_sha = os.environ["RELEASE_EVIDENCE_SOURCE_REVISION"]
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("source_sha must be a 40-character lower-case Git SHA")

          raw_digests = os.environ.get("RELEASE_EVIDENCE_IMAGE_DIGESTS", "")
          if not raw_digests:
              raise SystemExit(0)

          digests = json.loads(raw_digests)
          expected = {"api", "grader", "web", "languagetool"}
          if not isinstance(digests, dict) or set(digests) != expected:
              raise SystemExit("image_digests must contain exactly api, grader, web and languagetool")
          if not all(
              isinstance(digest, str) and re.fullmatch(r"sha256:[0-9a-f]{64}", digest)
              for digest in digests.values()
          ):
              raise SystemExit("image_digests must contain only SHA-256 digests")

          output = Path("artifacts/verification-release-evidence/release-manifest.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(
                  {"source_sha": source_sha, "image_digests": digests},
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Prepare published candidate images
        if: inputs.image_digests != ''
        shell: bash
        env:
          IMAGE_DIGESTS: ${{ inputs.image_digests }}
        run: |
          python - <<'PY'
          import json
          import os
          import re

          digests = json.loads(os.environ["IMAGE_DIGESTS"])
          expected = {"api", "grader", "web", "languagetool"}
          if not isinstance(digests, dict) or set(digests) != expected:
              raise SystemExit("image_digests must contain exactly api, grader, web and languagetool")
          if not all(
              isinstance(digest, str) and re.fullmatch(r"sha256:[0-9a-f]{64}", digest)
              for digest in digests.values()
          ):
              raise SystemExit("image_digests must contain only SHA-256 digests")

          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(
                  "RELEASE_EVIDENCE_GRADER_IMAGE="
                  f"ghcr.io/{owner}/edu-homework-grader-grader@{digests['grader']}\n"
              )
              output.write(
                  "RELEASE_EVIDENCE_LANGUAGETOOL_IMAGE="
                  f"ghcr.io/{owner}/edu-homework-grader-languagetool@{digests['languagetool']}\n"
              )
          PY

      - name: Log in to candidate image registry
        if: inputs.image_digests != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published candidate images
        if: inputs.image_digests != ''
        shell: bash
        run: |
          docker pull "$RELEASE_EVIDENCE_GRADER_IMAGE"
          docker pull "$RELEASE_EVIDENCE_LANGUAGETOOL_IMAGE"

      - name: Execute release evidence scenarios
        id: evidence
        continue-on-error: true
        run: >-
          make verification-release-evidence
          OUTPUT=artifacts/verification-release-evidence
          REPETITIONS=2

      - name: Publish evidence summary
        if: always()
        run: |
          if [[ -f artifacts/verification-release-evidence/verification-release-evidence-v1.md ]]; then
            cat artifacts/verification-release-evidence/verification-release-evidence-v1.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release evidence report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-release-evidence-v1-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          path: artifacts/verification-release-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Record observational pull-request failure
        if: github.event_name == 'pull_request' && steps.evidence.outcome != 'success'
        run: echo "::warning::Release evidence is observational on pull requests; inspect the uploaded de-identified artifact."

      - name: Enforce manual and release-candidate execution
        if: github.event_name != 'pull_request' && steps.evidence.outcome != 'success'
        run: exit 1
