name: PR 123 Python readiness contract pusher

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr123-python-contract-pusher
  cancel-in-progress: true

jobs:
  patch-test-push:
    if: github.head_ref == 'agent/verification-release-evidence-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/verification-release-evidence-v1
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply Python readiness contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          module_path = Path(
              "apps/api/src/edu_grader_api/services/verification_release_evidence.py"
          )
          module = module_path.read_text(encoding="utf-8")
          if "import httpx\n" not in module:
              marker = "from urllib.request import Request, urlopen\n\n"
              if marker not in module:
                  raise SystemExit("httpx import marker missing")
              module = module.replace(marker, marker + "import httpx\n", 1)
          module = module.replace(
              "from .grader import HttpGraderClient\n",
              "from .grader import GraderRequestTimeoutError, HttpGraderClient\n",
              1,
          )
          helper_start = module.index("def _wait_for_language_dependency(")
          helper_end = module.index("\ndef _capture_service_environment(", helper_start)
          helper = module[helper_start:helper_end]
          old_answer = '{"text": "I travelled by train."}'
          new_answer = '{"format": "text-v1", "text": "I travelled by train."}'
          if old_answer in helper:
              helper = helper.replace(old_answer, new_answer, 1)
          elif new_answer not in helper:
              raise SystemExit("readiness answer marker missing")
          old_except = "        except Exception:\n            time.sleep(1)"
          new_except = (
              "        except (GraderRequestTimeoutError, httpx.HTTPError):\n"
              "            time.sleep(1)"
          )
          if old_except in helper:
              helper = helper.replace(old_except, new_except, 1)
          elif new_except not in helper:
              raise SystemExit("readiness retry marker missing")
          module = module[:helper_start] + helper + module[helper_end:]
          module_path.write_text(module, encoding="utf-8")

          test_path = Path("apps/api/tests/test_verification_release_evidence.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              'raise RuntimeError("synthetic warmup")',
              'raise evidence.GraderRequestTimeoutError("language")',
              1,
          )
          if "test_language_dependency_readiness_uses_text_v1_envelope" not in tests:
              tests += '''


          class _CapturingLanguageGrader:
              def __init__(self) -> None:
                  self.answer_json: dict[str, object] | None = None

              def grade(
                  self,
                  question_type: str,
                  rule_json: dict[str, object],
                  answer_json: dict[str, object],
                  *,
                  policy_version: str | None = None,
              ) -> object:
                  self.answer_json = answer_json
                  return object()


          def test_language_dependency_readiness_uses_text_v1_envelope() -> None:
              grader = _CapturingLanguageGrader()

              evidence._wait_for_language_dependency(  # type: ignore[arg-type]
                  grader,
                  timeout_seconds=1,
              )

              assert grader.answer_json == {
                  "format": "text-v1",
                  "text": "I travelled by train.",
              }


          class _InvalidContractGrader:
              def __init__(self) -> None:
                  self.calls = 0

              def grade(self, *args: object, **kwargs: object) -> object:
                  self.calls += 1
                  raise ValueError("invalid local adapter contract")


          def test_language_dependency_readiness_does_not_mask_contract_errors() -> None:
              grader = _InvalidContractGrader()

              with pytest.raises(ValueError, match="invalid local adapter contract"):
                  evidence._wait_for_language_dependency(  # type: ignore[arg-type]
                      grader,
                      timeout_seconds=1,
                  )

              assert grader.calls == 1
          '''
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Format, lint, and run focused regression
        run: |
          set -euo pipefail
          make install-python >/dev/null
          python -m ruff format \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py
          python -m ruff check --fix --config ruff.toml \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py
          python -m ruff check --config ruff.toml \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py
          python -m pytest \
            apps/api/tests/test_verification_release_evidence.py \
            apps/api/tests/test_budget_aware_verification.py \
            apps/api/tests/test_capacity_aware_verification.py \
            apps/api/tests/test_verification_budget_stage_boundaries.py -q
          docker compose --file infra/release-evidence/compose.yaml config --quiet
          git diff --check

      - name: Push verified Python changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py
          git commit -m 'fix: enforce the LanguageTool readiness contract'
          git fetch origin agent/verification-release-evidence-v1
          git rebase origin/agent/verification-release-evidence-v1
          git push origin HEAD:agent/verification-release-evidence-v1
