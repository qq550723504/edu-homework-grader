name: PR 123 release evidence recovery fix

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr123-release-evidence-recovery-fix
  cancel-in-progress: true

jobs:
  fix-and-test:
    if: github.head_ref == 'agent/verification-release-evidence-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/verification-release-evidence-v1
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply recovery and source revision fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          module_path = Path(
              "apps/api/src/edu_grader_api/services/verification_release_evidence.py"
          )
          module = module_path.read_text(encoding="utf-8")

          function_marker = "def _language_recovery_scenario("
          function_start = module.index(function_marker)
          function_end = module.index("\ndef _capture_service_environment", function_start)
          prefix = module[:function_start]
          function = module[function_start:function_end]
          suffix = module[function_end:]

          candidate_marker = '    candidate = _base_candidate("E3")\n'
          if candidate_marker not in function:
              raise SystemExit("language recovery candidate marker missing")
          function = function.replace(
              candidate_marker,
              candidate_marker + '    candidate["difficulty"] = 0.2\n',
              1,
          )

          recovery_marker = (
              '    _compose(context, "start", "languagetool")\n'
              '    _wait_for_http(context.languagetool_health_url, timeout_seconds=90)\n'
              '    recovery_run = run_budget_aware_candidate_verification(\n'
          )
          if recovery_marker not in function:
              raise SystemExit("language recovery readiness marker missing")
          function = function.replace(
              recovery_marker,
              (
                  '    _compose(context, "start", "languagetool")\n'
                  '    _wait_for_http(context.languagetool_health_url, timeout_seconds=90)\n'
                  '    _compose(context, "restart", "grader")\n'
                  '    _wait_for_http(f"{context.grader_url}/health", timeout_seconds=90)\n'
                  '    recovery_run = run_budget_aware_candidate_verification(\n'
              ),
              1,
          )

          source_marker = (
              'def _source_revision() -> str:\n'
              '    configured = os.environ.get("GITHUB_SHA")\n'
          )
          if source_marker not in suffix:
              raise SystemExit("source revision marker missing")
          suffix = suffix.replace(
              source_marker,
              (
                  'def _source_revision() -> str:\n'
                  '    configured = os.environ.get("RELEASE_EVIDENCE_SOURCE_REVISION") or os.environ.get(\n'
                  '        "GITHUB_SHA"\n'
                  '    )\n'
              ),
              1,
          )
          module_path.write_text(prefix + function + suffix, encoding="utf-8")

          test_path = Path("apps/api/tests/test_verification_release_evidence.py")
          test = test_path.read_text(encoding="utf-8")
          import_marker = "import pytest\n\n"
          if import_marker not in test:
              raise SystemExit("test import marker missing")
          test = test.replace(
              import_marker,
              import_marker
              + "from edu_grader_api.services import verification_release_evidence as evidence\n",
              1,
          )
          test += (
              "\n\ndef test_source_revision_prefers_explicit_evidence_revision(\n"
              "    monkeypatch: pytest.MonkeyPatch,\n"
              ") -> None:\n"
              "    monkeypatch.setenv(\"RELEASE_EVIDENCE_SOURCE_REVISION\", \"head-sha\")\n"
              "    monkeypatch.setenv(\"GITHUB_SHA\", \"merge-sha\")\n\n"
              "    assert evidence._source_revision() == \"head-sha\"\n"
          )
          test_path.write_text(test, encoding="utf-8")
          PY

      - name: Format, lint, and run focused regression
        run: |
          set -euo pipefail
          make install-python >/dev/null
          python -m ruff format \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py
          python -m ruff check --fix --config ruff.toml \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py
          python -m ruff check --config ruff.toml \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py
          python -m pytest \
            apps/api/tests/test_verification_release_evidence.py \
            apps/api/tests/test_budget_aware_verification.py \
            apps/api/tests/test_capacity_aware_verification.py -q
          docker compose --file infra/release-evidence/compose.yaml config --quiet
          git diff --check

      - name: Push verified code changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/pr123-recovery-diagnostic.txt
          git add \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py \
            .github/pr123-recovery-diagnostic.txt
          git commit -m 'fix: stabilize release evidence recovery'
          git fetch origin agent/verification-release-evidence-v1
          git rebase origin/agent/verification-release-evidence-v1
          git push origin HEAD:agent/verification-release-evidence-v1
