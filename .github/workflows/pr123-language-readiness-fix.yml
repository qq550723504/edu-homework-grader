name: PR 123 language readiness fix

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr123-language-readiness-fix
  cancel-in-progress: true

jobs:
  fix-and-test:
    if: github.head_ref == 'agent/verification-release-evidence-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/verification-release-evidence-v1
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply language readiness probe
        run: |
          python - <<'PY'
          from pathlib import Path

          module_path = Path(
              "apps/api/src/edu_grader_api/services/verification_release_evidence.py"
          )
          module = module_path.read_text(encoding="utf-8")
          call_marker = (
              '    _compose(context, "restart", "grader")\n'
              '    _wait_for_http(f"{context.grader_url}/health", timeout_seconds=90)\n'
              '    recovery_run = run_budget_aware_candidate_verification(\n'
          )
          if call_marker not in module:
              raise SystemExit("language readiness call marker missing")
          module = module.replace(
              call_marker,
              (
                  '    _compose(context, "restart", "grader")\n'
                  '    _wait_for_http(f"{context.grader_url}/health", timeout_seconds=90)\n'
                  '    _wait_for_language_dependency(grader, timeout_seconds=90)\n'
                  '    recovery_run = run_budget_aware_candidate_verification(\n'
              ),
              1,
          )

          helper_marker = "\ndef _capture_service_environment("
          helper = '''

def _wait_for_language_dependency(
    grader: HttpGraderClient,
    *,
    timeout_seconds: float,
) -> None:
    deadline = time.monotonic() + timeout_seconds
    while time.monotonic() < deadline:
        try:
            grader.grade(
                "E3",
                {
                    "grammar_feedback_required": True,
                    "accepted_answers": ["I travelled by train."],
                    "max_score": 1,
                },
                {"text": "I travelled by train."},
                policy_version="1",
            )
            return
        except Exception:
            time.sleep(1)
    raise RuntimeError("language dependency did not recover")
'''
          if helper_marker not in module:
              raise SystemExit("language readiness helper marker missing")
          module = module.replace(helper_marker, helper + helper_marker, 1)
          module_path.write_text(module, encoding="utf-8")

          test_path = Path("apps/api/tests/test_verification_release_evidence.py")
          test = test_path.read_text(encoding="utf-8")
          test += '''

class _RecoveringLanguageGrader:
    def __init__(self) -> None:
        self.calls = 0

    def grade(self, *args: object, **kwargs: object) -> object:
        self.calls += 1
        if self.calls == 1:
            raise RuntimeError("synthetic warmup")
        return object()


def test_language_dependency_readiness_retries_without_persisting(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    grader = _RecoveringLanguageGrader()
    monkeypatch.setattr(evidence.time, "monotonic", lambda: 0.0)
    monkeypatch.setattr(evidence.time, "sleep", lambda seconds: None)

    evidence._wait_for_language_dependency(  # type: ignore[arg-type]
        grader,
        timeout_seconds=1,
    )

    assert grader.calls == 2
'''
          test_path.write_text(test, encoding="utf-8")
          PY

      - name: Format, lint, and run focused regression
        run: |
          set -euo pipefail
          make install-python >/dev/null
          python -m ruff format \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py
          python -m ruff check --fix --config ruff.toml \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py
          python -m ruff check --config ruff.toml \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py
          python -m pytest \
            apps/api/tests/test_verification_release_evidence.py \
            apps/api/tests/test_budget_aware_verification.py \
            apps/api/tests/test_capacity_aware_verification.py -q
          docker compose --file infra/release-evidence/compose.yaml config --quiet
          git diff --check

      - name: Push verified code changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py
          git commit -m 'fix: wait for language dependency recovery'
          git fetch origin agent/verification-release-evidence-v1
          git rebase origin/agent/verification-release-evidence-v1
          git push origin HEAD:agent/verification-release-evidence-v1
