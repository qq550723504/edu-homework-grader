name: PR 110 integrator diagnostics

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/verification-duplicate-boundaries-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/verification-duplicate-boundaries-v2

      - name: Reproduce embedded patch script
        id: reproduce
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/pr110-duplicate-boundaries-integrator.yml').read_text(
              encoding='utf-8'
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Install, format, lint, and run focused regression"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow[start:end].splitlines()
          )
          Path('/tmp/pr110_patch.py').write_text(script + '\n', encoding='utf-8')
          completed = subprocess.run(
              ['python', '/tmp/pr110_patch.py'],
              text=True,
              capture_output=True,
              check=False,
          )
          output = (completed.stdout + '\n' + completed.stderr).strip()
          Path('/tmp/pr110-diagnostic.txt').write_text(
              f'exit_code={completed.returncode}\n' + output[-6000:] + '\n',
              encoding='utf-8',
          )
          raise SystemExit(completed.returncode)
          PY

      - name: Publish diagnostic summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### PR #117 integrator diagnostic'
            echo
            echo '```text'
            cat /tmp/pr110-diagnostic.txt 2>/dev/null || echo 'diagnostic output was not produced'
            echo '```'
          } > /tmp/comment.md
          gh pr comment 117 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
