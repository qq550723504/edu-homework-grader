name: PR 123 language recovery stage diagnostic

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr123-language-stage-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'agent/verification-release-evidence-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PROCESSOR_ALLOWED_HOSTS: grader,languagetool,localhost,127.0.0.1
      GRADER_REQUEST_TIMEOUT_SECONDS: "5"
      VERIFICATION_TOTAL_TIMEOUT_SECONDS: "30"
      RELEASE_EVIDENCE_POSTGRES_PORT: "57432"
      RELEASE_EVIDENCE_GRADER_PORT: "60010"
      RELEASE_EVIDENCE_LANGUAGETOOL_PORT: "60011"
      RELEASE_EVIDENCE_DATABASE_URL: postgresql+psycopg://release_evidence:release-evidence-password@127.0.0.1:57432/release_evidence
      RELEASE_EVIDENCE_GRADER_URL: http://127.0.0.1:60010
      RELEASE_EVIDENCE_LANGUAGETOOL_HEALTH_URL: http://127.0.0.1:60011/v2/languages
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/verification-release-evidence-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python packages
        run: make install-python

      - name: Execute language recovery stages
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from edu_grader_api.services import verification_release_evidence as evidence
          from edu_grader_api.services.grader import HttpGraderClient
          from edu_grader_api.services.verification_performance import (
              BenchmarkCase,
              _base_candidate,
              _create_synthetic_draft,
          )
          from edu_grader_api.services.verification_capacity import (
              evaluate_verification_capacity,
          )
          from edu_grader_api.services.budget_aware_verification import (
              run_budget_aware_candidate_verification,
          )

          context = evidence.ComposeContext(
              compose_file=Path('infra/release-evidence/compose.yaml'),
              project_name=f'pr123-language-stage-{os.getpid()}',
              database_url=os.environ['RELEASE_EVIDENCE_DATABASE_URL'],
              grader_url=os.environ['RELEASE_EVIDENCE_GRADER_URL'],
              languagetool_health_url=os.environ[
                  'RELEASE_EVIDENCE_LANGUAGETOOL_HEALTH_URL'
              ],
          )
          diagnostic: dict[str, object] = {
              'stage': 'compose_start',
              'outcomes': {},
              'cleanup': {'status': 'pending'},
          }
          outcomes = diagnostic['outcomes']
          assert isinstance(outcomes, dict)
          session = None
          try:
              evidence._compose(
                  context,
                  'up',
                  '--detach',
                  '--build',
                  '--wait',
                  '--wait-timeout',
                  '240',
                  'postgres',
                  'languagetool',
                  'grader',
              )
              outcomes['compose_start'] = 'succeeded'
              diagnostic['stage'] = 'database_migration'
              evidence._run_migrations(context.database_url)
              outcomes['database_migration'] = 'succeeded'

              session = evidence._session(context.database_url)
              diagnostic['stage'] = 'seed'
              candidate = _base_candidate('E3')
              candidate['difficulty'] = 0.2
              capacity = evaluate_verification_capacity(candidate)
              case = BenchmarkCase(
                  case_id='language-stage-diagnostic',
                  question_type='E3',
                  load_bucket='small',
                  policy_version='1',
                  expected_status='passed',
                  candidate_bytes=capacity.observations['candidate_bytes'],
                  candidate=candidate,
              )
              draft = _create_synthetic_draft(session, case=case, ordinal=1)
              session.commit()
              revision = evidence._revision(session, draft)
              grader = HttpGraderClient(context.grader_url)
              outcomes['seed'] = 'succeeded'

              diagnostic['stage'] = 'outage_stop'
              evidence._compose(context, 'stop', 'languagetool')
              outcomes['outage_stop'] = 'succeeded'
              diagnostic['stage'] = 'outage_verify'
              outage_run = run_budget_aware_candidate_verification(
                  session,
                  draft=draft,
                  revision=revision,
                  grader_client=grader,
              )
              session.commit()
              outcomes['outage_status'] = outage_run.status.value
              outcomes['outage_findings'] = evidence._finding_codes(outage_run)

              diagnostic['stage'] = 'restore_stack'
              evidence._compose(
                  context,
                  'up',
                  '--detach',
                  '--force-recreate',
                  '--wait',
                  '--wait-timeout',
                  '240',
                  'languagetool',
                  'grader',
              )
              outcomes['restore_stack'] = 'succeeded'

              diagnostic['stage'] = 'languagetool_warmup'
              evidence._warm_language_tool(
                  context.languagetool_health_url,
                  timeout_seconds=120,
              )
              outcomes['languagetool_warmup'] = 'succeeded'

              diagnostic['stage'] = 'grader_health'
              evidence._wait_for_http(
                  f'{context.grader_url}/health',
                  timeout_seconds=90,
              )
              outcomes['grader_health'] = 'succeeded'

              diagnostic['stage'] = 'language_readiness'
              evidence._wait_for_language_dependency(grader, timeout_seconds=120)
              outcomes['language_readiness'] = 'succeeded'

              diagnostic['stage'] = 'recovery_verify'
              recovery_run = run_budget_aware_candidate_verification(
                  session,
                  draft=draft,
                  revision=revision,
                  grader_client=grader,
              )
              session.commit()
              outcomes['recovery_status'] = recovery_run.status.value
              outcomes['recovery_findings'] = evidence._finding_codes(recovery_run)
              diagnostic['stage'] = 'completed'
          except Exception as error:
              diagnostic['error_type'] = type(error).__name__
              code = getattr(error, 'code', None)
              if isinstance(code, str):
                  diagnostic['error_code'] = code
              if session is not None:
                  session.rollback()
          finally:
              if session is not None:
                  session.close()
              diagnostic['cleanup'] = evidence._cleanup(context)

          evidence.assert_deidentified_evidence(diagnostic)
          output = Path('artifacts/pr123-language-stage')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'diagnostic.json').write_text(
              json.dumps(diagnostic, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload stage diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pr123-language-stage-${{ github.event.pull_request.head.sha }}
          path: artifacts/pr123-language-stage
          retention-days: 2
