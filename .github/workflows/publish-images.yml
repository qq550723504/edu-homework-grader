name: Publish production images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  eligibility:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      release_eligible: ${{ steps.release.outputs.release_eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: release
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- . ':(exclude)docs/**' ':(exclude)*.md'; then
            echo "release_eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_eligible=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: eligibility
    if: needs.eligibility.outputs.release_eligible == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
          - name: grader
            context: .
            file: services/grader/Dockerfile
          - name: web
            context: apps/web
            file: apps/web/Dockerfile
          - name: languagetool
            context: infra/languagetool
            file: infra/languagetool/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/edu-homework-grader-${{ matrix.name }}:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: [eligibility, publish]
    if: >-
      needs.eligibility.outputs.release_eligible == 'true' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://edu.getkr.com
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the successful CI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Reject a superseded production release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --depth=1
          main_sha="$(git rev-parse origin/main)"
          release_sha="${{ github.event.workflow_run.head_sha }}"
          if [[ "$release_sha" != "$main_sha" ]]; then
            echo "Refusing superseded production release." >&2
            exit 1
          fi

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.34.1

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: 5.7.1

      - name: Configure production kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          kubeconfig_path="$RUNNER_TEMP/production-kubeconfig"
          umask 077
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$kubeconfig_path"
          echo "KUBECONFIG=$kubeconfig_path" >> "$GITHUB_ENV"

      - name: Deploy approved production release
        shell: pwsh
        run: >-
          ./scripts/k8s/deploy-production.ps1
          -ImageSha "${{ github.event.workflow_run.head_sha }}"

      - name: Remove production kubeconfig
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/production-kubeconfig"
