name: Publish production images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  eligibility:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      release_eligible: ${{ steps.release.outputs.release_eligible }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: release
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- . ':(exclude)docs/**' ':(exclude)*.md'; then
            echo "release_eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_eligible=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: eligibility
    if: needs.eligibility.outputs.release_eligible == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
          - name: grader
            context: .
            file: services/grader/Dockerfile
          - name: web
            context: apps/web
            file: apps/web/Dockerfile
          - name: languagetool
            context: infra/languagetool
            file: infra/languagetool/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/edu-homework-grader-${{ matrix.name }}:${{ github.event.workflow_run.head_sha }}

      - name: Record immutable image digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-image-digest"
          printf '%s\n' '${{ steps.build.outputs.digest }}' > "$RUNNER_TEMP/release-image-digest/${{ matrix.name }}.txt"

      - name: Upload immutable image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.name }}
          path: ${{ runner.temp }}/release-image-digest/${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 1

  release-manifest:
    needs: [eligibility, publish]
    if: >-
      needs.eligibility.outputs.release_eligible == 'true' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      image_digests: ${{ steps.manifest.outputs.image_digests }}
    steps:
      - name: Download immutable image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/release-image-digests
          merge-multiple: true

      - name: Validate immutable image digests
        id: manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          directory = Path(os.environ["RUNNER_TEMP"]) / "release-image-digests"
          expected = ("api", "grader", "web", "languagetool")
          files = sorted(path.name for path in directory.glob("*.txt"))
          if files != sorted(f"{name}.txt" for name in expected):
              raise SystemExit("release candidate must provide exactly four image digest artifacts")

          digests = {}
          for name in expected:
              digest = (directory / f"{name}.txt").read_text(encoding="utf-8").strip()
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit(f"{name} image digest is not a SHA-256 digest")
              digests[name] = digest

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("image_digests=" + json.dumps(digests, sort_keys=True, separators=(",", ":")) + "\n")
          PY

  release-evidence:
    needs: release-manifest
    if: needs.release-manifest.result == 'success'
    uses: ./.github/workflows/verification-release-evidence.yml
    with:
      source_sha: ${{ github.event.workflow_run.head_sha }}
      image_digests: ${{ needs.release-manifest.outputs.image_digests }}

  deploy:
    needs: [eligibility, publish, release-manifest, release-evidence]
    if: >-
      needs.eligibility.outputs.release_eligible == 'true' &&
      needs.publish.result == 'success' &&
      needs.release-manifest.result == 'success' &&
      needs.release-evidence.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://edu.getkr.com
    permissions:
      contents: read
    steps:
      - name: Check out the successful CI revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Reject a superseded production release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +main:refs/remotes/origin/main
          release_sha="${{ github.event.workflow_run.head_sha }}"
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "Refusing superseded production release." >&2
            exit 1
          fi
          if ! git diff --quiet "$release_sha" origin/main -- \
            . ':(exclude)docs/**' ':(exclude,glob)**/*.md'; then
            echo "Refusing superseded production release." >&2
            exit 1
          fi

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.34.1

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
        with:
          kustomize-version: 5.7.1

      - name: Configure production kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          kubeconfig_path="$RUNNER_TEMP/production-kubeconfig"
          umask 077
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$kubeconfig_path"
          echo "KUBECONFIG=$kubeconfig_path" >> "$GITHUB_ENV"

      - name: Recheck release immediately before deploy
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +main:refs/remotes/origin/main
          release_sha="${{ github.event.workflow_run.head_sha }}"
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "Refusing superseded production release." >&2
            exit 1
          fi
          if ! git diff --quiet "$release_sha" origin/main -- \
            . ':(exclude)docs/**' ':(exclude,glob)**/*.md'; then
            echo "Refusing superseded production release." >&2
            exit 1
          fi

      - name: Deploy approved production release
        shell: pwsh
        env:
          IMAGE_DIGESTS_JSON: ${{ needs.release-manifest.outputs.image_digests }}
        run: >-
          ./scripts/k8s/deploy-production.ps1
          -ImageSha "${{ github.event.workflow_run.head_sha }}"
          -ImageDigestsJson "$env:IMAGE_DIGESTS_JSON"

      - name: Remove production kubeconfig
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/production-kubeconfig"
