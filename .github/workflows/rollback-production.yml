name: Roll back production

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Immutable 40-character commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://edu.getkr.com
    steps:
      - name: Check out current deployment tooling
        uses: actions/checkout@v4

      - name: Validate rollback image SHA
        shell: bash
        env:
          REQUESTED_IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_sha must be a 40-character lower-case Git SHA." >&2
            exit 1
          fi
          echo "IMAGE_SHA=$REQUESTED_IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify rollback images exist
        shell: bash
        run: |
          set -euo pipefail
          for image in api grader web languagetool; do
            docker manifest inspect \
              "ghcr.io/${{ github.repository_owner }}/edu-homework-grader-${image}:${IMAGE_SHA}" \
              >/dev/null
          done

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.34.1

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: 5.7.1

      - name: Configure production kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          kubeconfig_path="$RUNNER_TEMP/production-kubeconfig"
          umask 077
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$kubeconfig_path"
          echo "KUBECONFIG=$kubeconfig_path" >> "$GITHUB_ENV"

      - name: Deploy approved rollback
        shell: pwsh
        run: ./scripts/k8s/deploy-production.ps1 -ImageSha "$IMAGE_SHA"

      - name: Remove production kubeconfig
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/production-kubeconfig"
