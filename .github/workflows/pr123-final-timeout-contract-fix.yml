name: PR 123 final timeout contract fix

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr123-final-timeout-contract-fix
  cancel-in-progress: true

jobs:
  fix-and-test:
    if: github.head_ref == 'agent/verification-release-evidence-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/verification-release-evidence-v1
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply readiness envelope and timeout hierarchy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"marker missing in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")


          module = "apps/api/src/edu_grader_api/services/verification_release_evidence.py"
          replace_once(
              module,
              "import time\nfrom typing import Mapping\n",
              "import time\nfrom typing import Mapping\n\nimport httpx\n",
          )
          replace_once(
              module,
              "from .grader import HttpGraderClient\n",
              "from .grader import GraderRequestTimeoutError, HttpGraderClient\n",
          )
          replace_once(
              module,
              '''                {"text": "I travelled by train."},
                  policy_version="1",
              )
              return
          except Exception:
              time.sleep(1)
          ''',
              '''                {"format": "text-v1", "text": "I travelled by train."},
                  policy_version="1",
              )
              return
          except (GraderRequestTimeoutError, httpx.HTTPError):
              time.sleep(1)
          ''',
          )

          tests = "apps/api/tests/test_verification_release_evidence.py"
          replace_once(
              tests,
              '''class _RecoveringLanguageGrader:
              def __init__(self) -> None:
                  self.calls = 0

              def grade(self, *args: object, **kwargs: object) -> object:
                  self.calls += 1
                  if self.calls == 1:
                      raise RuntimeError("synthetic warmup")
                  return object()


          def test_language_dependency_readiness_retries_without_persisting(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              grader = _RecoveringLanguageGrader()
              monkeypatch.setattr(evidence.time, "monotonic", lambda: 0.0)
              monkeypatch.setattr(evidence.time, "sleep", lambda seconds: None)

              evidence._wait_for_language_dependency(  # type: ignore[arg-type]
                  grader,
                  timeout_seconds=1,
              )

              assert grader.calls == 2
          ''',
              '''class _RecoveringLanguageGrader:
              def __init__(self) -> None:
                  self.calls: list[tuple[str, dict[str, object], dict[str, object], str | None]] = []

              def grade(
                  self,
                  question_type: str,
                  rule_json: dict[str, object],
                  answer_json: dict[str, object],
                  *,
                  policy_version: str | None = None,
              ) -> object:
                  self.calls.append((question_type, rule_json, answer_json, policy_version))
                  if len(self.calls) == 1:
                      raise evidence.GraderRequestTimeoutError("language")
                  return object()


          def test_language_dependency_readiness_retries_with_valid_text_envelope(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              grader = _RecoveringLanguageGrader()
              monkeypatch.setattr(evidence.time, "monotonic", lambda: 0.0)
              monkeypatch.setattr(evidence.time, "sleep", lambda seconds: None)

              evidence._wait_for_language_dependency(  # type: ignore[arg-type]
                  grader,
                  timeout_seconds=1,
              )

              assert len(grader.calls) == 2
              question_type, _, answer_json, policy_version = grader.calls[-1]
              assert question_type == "E3"
              assert answer_json == {
                  "format": "text-v1",
                  "text": "I travelled by train.",
              }
              assert policy_version == "1"
          ''',
          )

          replace_once(
              ".github/workflows/verification-release-evidence.yml",
              '      GRADER_REQUEST_TIMEOUT_SECONDS: "5"\n',
              '      GRADER_REQUEST_TIMEOUT_SECONDS: "15"\n',
          )
          replace_once(
              "infra/release-evidence/compose.yaml",
              "      LANGUAGETOOL_TIMEOUT_SECONDS: 10\n",
              "      LANGUAGETOOL_TIMEOUT_SECONDS: 5\n",
          )
          PY

      - name: Format, lint, and run focused regression
        run: |
          set -euo pipefail
          make install-python >/dev/null
          python -m ruff format \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py
          python -m ruff check --fix --config ruff.toml \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py
          python -m ruff check --config ruff.toml \
            apps/api/src/edu_grader_api/services/verification_release_evidence.py \
            apps/api/tests/test_verification_release_evidence.py
          python -m pytest \
            apps/api/tests/test_verification_release_evidence.py \
            apps/api/tests/test_budget_aware_verification.py \
            apps/api/tests/test_capacity_aware_verification.py \
            apps/api/tests/test_verification_budget_stage_boundaries.py -q
          docker compose --file infra/release-evidence/compose.yaml config --quiet
          git diff --check

      - name: Remove diagnostics and push final implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f \
            .github/workflows/pr123-final-timeout-contract-fix.yml \
            .github/workflows/pr123-language-stage-diagnostic.yml \
            .github/pr123-language-stage-trigger.txt \
            .github/pr123-final-timeout-contract-trigger.txt
          git add -A
          git commit -m 'fix: finalize release evidence timeout contracts'
          git fetch origin agent/verification-release-evidence-v1
          git rebase origin/agent/verification-release-evidence-v1
          git push origin HEAD:agent/verification-release-evidence-v1
