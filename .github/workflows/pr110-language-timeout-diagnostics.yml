name: PR 110 LanguageTool timeout diagnostics

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/languagetool-timeout-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/languagetool-timeout-v1

      - name: Reproduce implementation and focused regression
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/pr110-language-timeout-integrator.yml').read_text(
              encoding='utf-8'
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Format, lint, and run cross-service regression"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow[start:end].splitlines()
          )
          Path('/tmp/pr110-language-patch.py').write_text(script + '\n', encoding='utf-8')
          completed = subprocess.run(
              ['python', '/tmp/pr110-language-patch.py'],
              text=True,
              capture_output=True,
              check=False,
          )
          if completed.returncode:
              print(completed.stdout)
              print(completed.stderr)
              raise SystemExit(completed.returncode)
          PY
          make install-python >/dev/null
          python -m ruff format \
            services/grader/src/edu_grader/english_dependencies.py \
            services/grader/src/edu_grader/english_orchestrator.py \
            services/grader/tests/test_english_dependencies.py \
            services/grader/tests/test_english_orchestrator.py \
            apps/api/src/edu_grader_api/services/grader.py \
            apps/api/src/edu_grader_api/services/budget_aware_verification.py \
            apps/api/tests/test_grader_language_timeout.py
          python -m ruff check --config ruff.toml \
            services/grader/src/edu_grader/english_dependencies.py \
            services/grader/src/edu_grader/english_orchestrator.py \
            services/grader/tests/test_english_dependencies.py \
            services/grader/tests/test_english_orchestrator.py \
            apps/api/src/edu_grader_api/services/grader.py \
            apps/api/src/edu_grader_api/services/budget_aware_verification.py \
            apps/api/tests/test_grader_language_timeout.py
          python -m pytest \
            services/grader/tests/test_english_dependencies.py \
            services/grader/tests/test_english_orchestrator.py \
            apps/api/tests/test_grader_language_timeout.py \
            apps/api/tests/test_budget_aware_verification.py \
            apps/api/tests/test_verification_budget.py -q 2>&1 | tee /tmp/pr110-language-regression.log

      - name: Publish diagnostic tail
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### PR #118 LanguageTool regression diagnostic'
            echo
            echo '```text'
            if [[ -f /tmp/pr110-language-regression.log ]]; then
              tail -n 160 /tmp/pr110-language-regression.log
            else
              echo 'The implementation or formatting phase failed before pytest output was created.'
            fi
            echo '```'
          } > /tmp/comment.md
          gh pr comment 118 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
