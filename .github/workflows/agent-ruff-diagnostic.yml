name: Agent Ruff diagnostic

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/agent-ruff-diagnostic.yml"
      - "apps/api/src/edu_grader_api/services/verification_release_timeout_evidence.py"
      - "apps/api/tests/test_verification_release_timeout_evidence.py"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Show pinned Ruff formatting diff
        shell: bash
        run: |
          git init --quiet
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth 1 origin "${GITHUB_SHA}"
          git checkout --quiet FETCH_HEAD
          python -m pip install --quiet ruff==0.16.0
          python -m ruff format --check --diff \
            apps/api/src/edu_grader_api/services/verification_release_timeout_evidence.py \
            apps/api/tests/test_verification_release_timeout_evidence.py
