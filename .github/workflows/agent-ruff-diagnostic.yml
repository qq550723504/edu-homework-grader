name: Agent Ruff diagnostic

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/agent-ruff-diagnostic.yml"
      - "apps/api/src/edu_grader_api/services/verification_release_timeout_evidence.py"
      - "apps/api/tests/test_verification_release_timeout_evidence.py"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned Ruff
        run: python -m pip install --quiet ruff==0.16.0
      - name: Show formatting diff
        run: >-
          python -m ruff format --check --diff
          apps/api/src/edu_grader_api/services/verification_release_timeout_evidence.py
          apps/api/tests/test_verification_release_timeout_evidence.py
