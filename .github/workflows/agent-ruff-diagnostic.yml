name: Agent Ruff autoformat

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/agent-ruff-diagnostic.yml"
      - "apps/api/src/edu_grader_api/services/verification_release_timeout_evidence.py"
      - "apps/api/tests/test_verification_release_timeout_evidence.py"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply pinned Ruff formatting
        shell: bash
        run: |
          python -m pip install --quiet ruff==0.16.0
          python -m ruff format \
            apps/api/src/edu_grader_api/services/verification_release_timeout_evidence.py \
            apps/api/tests/test_verification_release_timeout_evidence.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/edu_grader_api/services/verification_release_timeout_evidence.py \
            apps/api/tests/test_verification_release_timeout_evidence.py
          git commit -m "style: format dependency timeout evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
