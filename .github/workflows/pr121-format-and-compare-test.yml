name: PR 121 format and compare test

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  format-and-test:
    if: >-
      github.head_ref == 'agent/verification-performance-compare-v1' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/verification-performance-compare-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python packages
        run: make install-python

      - name: Format, lint, and run focused comparison tests
        run: |
          set -euo pipefail
          make ruff-version-check
          python -m ruff format \
            apps/api/src/edu_grader_api/services/verification_performance_compare.py \
            apps/api/tests/test_verification_performance_compare.py
          python -m ruff check --config ruff.toml \
            apps/api/src/edu_grader_api/services/verification_performance_compare.py \
            apps/api/tests/test_verification_performance_compare.py
          python -m pytest \
            apps/api/tests/test_verification_performance.py \
            apps/api/tests/test_verification_performance_compare.py -q
          VERIFICATION_PERFORMANCE_SOURCE_REVISION=baseline \
            make verification-performance WARMUPS=0 ITERATIONS=1 OUTPUT=/tmp/performance-baseline
          VERIFICATION_PERFORMANCE_SOURCE_REVISION=candidate \
            make verification-performance WARMUPS=0 ITERATIONS=1 OUTPUT=/tmp/performance-candidate
          make verification-performance-compare \
            BASELINE=/tmp/performance-baseline/verification-performance-v1.json \
            CANDIDATE=/tmp/performance-candidate/verification-performance-v1.json \
            OUTPUT=/tmp/performance-comparison
          test -s /tmp/performance-comparison/verification-performance-comparison-v1.json
          test -s /tmp/performance-comparison/verification-performance-comparison-v1.md
          git diff --check

      - name: Commit formatted implementation and remove workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr121-format-and-compare-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: validate performance report comparison'
          git push origin HEAD:agent/verification-performance-compare-v1
