name: Build API migration image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable 40-character source commit SHA containing the Alembic history.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 0
          fi
          echo 'source_sha must be a 40-character lower-case Git SHA.' >&2
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/edu-homework-grader-api:${{ inputs.source_sha }}

      - name: Record immutable image digest
        shell: bash
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/edu-homework-grader-api
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Build did not return a valid SHA-256 image digest.' >&2
            exit 1
          fi
          printf '%s\n' "$IMAGE_DIGEST" > api-migration-image-digest.txt
          printf 'Migration image: `%s@%s`\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-migration-image-digest
          path: api-migration-image-digest.txt
          if-no-files-found: error
          retention-days: 1
