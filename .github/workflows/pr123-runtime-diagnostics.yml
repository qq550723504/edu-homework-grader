name: PR 123 release evidence runtime diagnostics

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr123-release-evidence-runtime-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'agent/verification-release-evidence-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PROCESSOR_ALLOWED_HOSTS: grader,languagetool,localhost,127.0.0.1
      GRADER_REQUEST_TIMEOUT_SECONDS: "5"
      VERIFICATION_TOTAL_TIMEOUT_SECONDS: "30"
      RELEASE_EVIDENCE_POSTGRES_PORT: "56432"
      RELEASE_EVIDENCE_GRADER_PORT: "59010"
      RELEASE_EVIDENCE_LANGUAGETOOL_PORT: "59011"
      RELEASE_EVIDENCE_DATABASE_URL: postgresql+psycopg://release_evidence:release-evidence-password@127.0.0.1:56432/release_evidence
      RELEASE_EVIDENCE_GRADER_URL: http://127.0.0.1:59010
      RELEASE_EVIDENCE_LANGUAGETOOL_HEALTH_URL: http://127.0.0.1:59011/v2/languages
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: agent/verification-release-evidence-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python packages
        run: make install-python

      - name: Execute PostgreSQL stages independently
        id: diagnose
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          from edu_grader_api.services import verification_release_evidence as evidence
          from edu_grader_api.services.grader import HttpGraderClient


          def safe_error(error: Exception) -> str:
              parts = [type(error).__name__]
              origin = getattr(error, "orig", None)
              if origin is not None:
                  parts.append(type(origin).__name__)
                  sqlstate = getattr(origin, "sqlstate", None) or getattr(
                      origin, "pgcode", None
                  )
                  if isinstance(sqlstate, str):
                      parts.append(f"sqlstate={sqlstate}")
                  diagnostic = getattr(origin, "diag", None)
                  for name in ("table_name", "column_name", "constraint_name"):
                      value = getattr(diagnostic, name, None) if diagnostic is not None else None
                      if isinstance(value, str) and value:
                          parts.append(f"{name}={value}")
              return ":".join(parts)


          def seed_case(session, *, question_type: str, ordinal: int, oversize: bool):
              candidate = evidence._base_candidate(question_type)
              if oversize:
                  candidate["release_evidence_padding"] = "x" * (
                      evidence.MAX_CANDIDATE_BYTES + 4096
                  )
              capacity = evidence.evaluate_verification_capacity(candidate)
              bucket = capacity.load_bucket
              case = evidence.BenchmarkCase(
                  case_id=f"diagnostic-{question_type.lower()}-{ordinal}",
                  question_type=question_type,
                  load_bucket=bucket,
                  policy_version="1",
                  expected_status="blocked" if oversize else "passed",
                  candidate_bytes=capacity.observations["candidate_bytes"],
                  candidate=candidate,
              )
              draft = evidence._create_synthetic_draft(session, case=case, ordinal=ordinal)
              session.commit()
              return draft


          context = evidence.ComposeContext(
              compose_file=Path("infra/release-evidence/compose.yaml"),
              project_name=f"pr123-runtime-diagnostic-{os.getpid()}",
              database_url=os.environ["RELEASE_EVIDENCE_DATABASE_URL"],
              grader_url=os.environ["RELEASE_EVIDENCE_GRADER_URL"],
              languagetool_health_url=os.environ[
                  "RELEASE_EVIDENCE_LANGUAGETOOL_HEALTH_URL"
              ],
          )
          outcomes: list[str] = []
          capacity_draft = None
          language_draft = None
          try:
              evidence._compose(
                  context,
                  "up",
                  "--detach",
                  "--wait",
                  "--wait-timeout",
                  "120",
                  "postgres",
              )
              outcomes.append("postgres_start=success")
              evidence._run_migrations(context.database_url)
              outcomes.append("database_migration=success")
              with evidence._session(context.database_url) as session:
                  try:
                      capacity_draft = seed_case(
                          session,
                          question_type="E3",
                          ordinal=1,
                          oversize=True,
                      )
                      outcomes.append("capacity_seed=success")
                  except Exception as error:
                      outcomes.append("capacity_seed=raised:" + safe_error(error))
                      session.rollback()

                  if capacity_draft is not None:
                      try:
                          revision = evidence._revision(session, capacity_draft)
                          run = evidence.run_budget_aware_candidate_verification(
                              session,
                              draft=capacity_draft,
                              revision=revision,
                              grader_client=HttpGraderClient("http://127.0.0.1:9"),
                          )
                          session.commit()
                          outcomes.append(
                              "capacity_verify="
                              + ("success" if run.status.value == "blocked" else "failed_result")
                          )
                      except Exception as error:
                          outcomes.append("capacity_verify=raised:" + safe_error(error))
                          session.rollback()

                  try:
                      language_draft = seed_case(
                          session,
                          question_type="E3",
                          ordinal=2,
                          oversize=False,
                      )
                      outcomes.append("language_seed=success")
                  except Exception as error:
                      outcomes.append("language_seed=raised:" + safe_error(error))
                      session.rollback()

              if language_draft is not None:
                  evidence._compose(
                      context,
                      "up",
                      "--detach",
                      "--build",
                      "--wait",
                      "--wait-timeout",
                      "240",
                      "languagetool",
                      "grader",
                  )
                  outcomes.append("grader_stack_start=success")
                  with evidence._session(context.database_url) as session:
                      stored_draft = session.get(type(language_draft), language_draft.id)
                      if stored_draft is None:
                          outcomes.append("language_recovery=failed_missing_draft")
                      else:
                          try:
                              result = evidence._language_recovery_scenario(session, context)
                              outcomes.append(
                                  "language_recovery="
                                  + ("success" if result.get("passed") is True else "failed_result")
                              )
                          except Exception as error:
                              outcomes.append("language_recovery=raised:" + safe_error(error))
                              session.rollback()
          except Exception as error:
              outcomes.append("orchestration=raised:" + safe_error(error))
          finally:
              cleanup = evidence._cleanup(context)
              outcomes.append(f"cleanup={cleanup.get('status', 'unknown')}")

          Path("/tmp/pr123-runtime-diagnostic.txt").write_text(
              "\n".join(outcomes) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish de-identified diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### PR #123 PostgreSQL stage diagnostic'
            echo
            echo '```text'
            cat /tmp/pr123-runtime-diagnostic.txt 2>/dev/null || echo 'diagnostic output unavailable'
            echo '```'
          } > /tmp/comment.md
          gh pr comment 123 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
