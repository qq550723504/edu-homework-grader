name: PR 123 final cleanup
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.head_ref == 'agent/verification-release-evidence-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verification-release-evidence-v1
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f \
            .github/workflows/pr123-release-evidence-recovery-fix.yml \
            .github/workflows/pr123-cleanup-final.yml \
            .github/pr123-delete-request.txt
          git add -A
          git commit -m 'chore: remove temporary recovery workflows'
          git push origin HEAD:agent/verification-release-evidence-v1
